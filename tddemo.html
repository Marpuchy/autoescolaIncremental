<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demostració</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%231c1638'/%3E%3Cpath d='M32 22c-6-5-14-6-22-5v30c8-1 16 0 22 5c6-5 14-6 22-5V17c-8-1-16 0-22 5z' fill='%232d2560' stroke='%23b48cff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 22v30' stroke='%23b48cff' stroke-width='4'/%3E%3Cpath d='M32 4l3 7 7 3-7 3-3 7-3-7-7-3 7-3z' fill='%23ffc23f'/%3E%3C/svg%3E">
  <!-- La demostració del grimori (js/td/demo.js): el combat de veritat dins d'un iframe, sense guardar res -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="td.css">
  <style>
    html, body { margin: 0; background: #07090f; overflow: hidden; }
    #td-battle { animation: none; }
    .tdb-top, .tdb-bottom, #tdb-end, .tdb-banner { display: none !important; }
    .tdb-map { flex: 1; }
    #tdb-svg { pointer-events: none; }
  </style>
</head>
<body>
  <div id="td-lobby" hidden></div>
  <div id="td-battle" class="td-screen">
    <div class="tdb-top" id="tdb-top">
      <span id="tdb-world"></span><strong id="tdb-wave"></strong><strong id="tdb-lives"></strong><strong id="tdb-mana"></strong><strong id="tdb-saber"></strong>
      <button id="tdb-next"></button><button id="tdb-speed"></button><button id="tdb-exit"></button>
    </div>
    <div class="tdb-map" id="tdb-map"><svg id="tdb-svg" preserveAspectRatio="xMidYMid meet" aria-label="Demostració"></svg><div class="tdb-banner" id="tdb-banner"></div></div>
    <div class="tdb-bottom"><div class="tdb-deck" id="tdb-deck"></div><div class="tdb-panel" id="tdb-panel" hidden></div></div>
    <div id="tdb-end" hidden><h2 id="tdb-end-title"></h2><div id="tdb-end-body"></div></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/td/data.js"></script>
  <script src="js/td/art.js"></script>
  <script src="js/td/state.js"></script>
  <script src="js/td/battle.js"></script>
  <script src="js/td/demo.js"></script>
</body>
</html>
