<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Polígon industrial: naus amb teulada de dents de serra, xemeneia fumejant, torre elèctrica i palets -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8e9e"/>
      <stop offset="0.55" stop-color="#b9c3cc"/>
      <stop offset="0.8" stop-color="#e4e3dc"/>
    </linearGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e3de" stop-opacity="0"/>
      <stop offset="1" stop-color="#e2e3de" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="xapa" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#bcc6cf"/>
      <rect width="4" height="18" fill="#a5b0bb"/>
      <rect x="4" width="2" height="18" fill="#d3dbe2"/>
    </pattern>
    <pattern id="xapaB" width="22" height="18" patternUnits="userSpaceOnUse">
      <rect width="22" height="18" fill="#a4b4a3"/>
      <rect width="4" height="18" fill="#8e9f8e"/>
    </pattern>
    <pattern id="persiana" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#76838f"/>
      <rect y="9" width="10" height="3" fill="#5f6b77"/>
    </pattern>
    <pattern id="reixa" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0 L16 16 M16 0 L0 16" stroke="#6b737c" stroke-width="1.4" opacity="0.7"/>
    </pattern>
    <linearGradient id="vidre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe2ef"/>
      <stop offset="1" stop-color="#7f9bb1"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5358"/>
      <stop offset="1" stop-color="#3b3e42"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.12"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.1"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
      <circle cx="12" cy="31" r="1" fill="#000" opacity="0.2"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#10141a" stop-opacity="0.4"/>
    </radialGradient>
    <symbol id="fanal" viewBox="0 0 60 300">
      <rect x="27" y="20" width="6" height="280" fill="#4b5058"/>
      <rect x="31" y="20" width="2" height="280" fill="#6a7079"/>
      <path d="M30 22 Q30 8 50 8 L56 8" stroke="#4b5058" stroke-width="5" fill="none"/>
      <rect x="42" y="5" width="18" height="9" rx="2" fill="#3c4047"/>
      <rect x="44" y="12" width="14" height="3" fill="#fbf1c2"/>
    </symbol>
    <symbol id="palet" viewBox="0 0 80 40">
      <rect x="0" y="0" width="80" height="26" fill="#b98a55"/>
      <rect x="0" y="0" width="80" height="4" fill="#d0a36d"/>
      <g fill="#8b6538"><rect x="0" y="8" width="80" height="3"/><rect x="0" y="16" width="80" height="3"/></g>
      <rect x="0" y="26" width="80" height="14" fill="#9c7443"/>
      <g fill="#5b4126"><rect x="8" y="30" width="16" height="10"/><rect x="56" y="30" width="16" height="10"/></g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- torre elèctrica i cables al fons -->
  <g stroke="#8a939c" stroke-width="3" fill="none" opacity="0.8">
    <path d="M430 520 L462 250 L494 520 M440 450 L484 450 M446 400 L478 400 M452 340 L472 340 M442 450 L476 400 M482 450 L448 400"/>
    <path d="M430 300 H494 M438 270 H486"/>
    <path d="M0 330 Q220 360 430 302 M494 302 Q700 360 900 318" stroke-width="1.5"/>
    <path d="M0 296 Q220 330 438 272 M486 272 Q700 330 900 288" stroke-width="1.5"/>
  </g>

  <!-- fum de la xemeneia -->
  <g>
    <g fill="#a9aeb4" opacity="0.8">
      <ellipse cx="1296" cy="176" rx="46" ry="34"/><ellipse cx="1350" cy="130" rx="74" ry="46"/>
      <ellipse cx="1450" cy="90" rx="110" ry="54"/><ellipse cx="1570" cy="64" rx="130" ry="54"/>
    </g>
    <g fill="#d2d5d9" opacity="0.9">
      <ellipse cx="1290" cy="166" rx="34" ry="24"/><ellipse cx="1342" cy="116" rx="56" ry="34"/>
      <ellipse cx="1440" cy="74" rx="84" ry="38"/><ellipse cx="1560" cy="48" rx="100" ry="38"/>
    </g>
  </g>

  <!-- naus del fons -->
  <rect x="0" y="470" width="1600" height="240" fill="#aab4bc"/>
  <path d="M0 470 L60 430 L60 470 L120 430 L120 470 L180 430 L180 470 L240 430 L240 470 Z" fill="#9aa5af"/>
  <rect x="620" y="440" width="120" height="270" fill="#b4bcc2"/>
  <rect x="660" y="360" width="30" height="80" fill="#9fa9b1"/><ellipse cx="675" cy="360" rx="34" ry="12" fill="#b4bcc2"/>
  <rect y="400" width="1600" height="160" fill="url(#boira)" opacity="0.8"/>

  <!-- NAU 7: teulada de dents de serra amb claraboies -->
  <rect x="60" y="370" width="560" height="340" fill="url(#xapa)"/>
  <rect x="60" y="370" width="560" height="340" fill="#000" opacity="0.04"/>
  <g>
    <path d="M60 370 L140 318 L140 370 L220 318 L220 370 L300 318 L300 370 L380 318 L380 370 L460 318 L460 370 L540 318 L540 370 L620 318 L620 370 Z" fill="#8c98a4"/>
    <g fill="url(#vidre)">
      <rect x="134" y="318" width="6" height="52"/><rect x="214" y="318" width="6" height="52"/><rect x="294" y="318" width="6" height="52"/>
      <rect x="374" y="318" width="6" height="52"/><rect x="454" y="318" width="6" height="52"/><rect x="534" y="318" width="6" height="52"/><rect x="614" y="318" width="6" height="52"/>
    </g>
  </g>
  <rect x="60" y="370" width="560" height="8" fill="#6e7a86"/>
  <rect x="220" y="408" width="200" height="56" rx="3" fill="#2f5d8a"/>
  <rect x="220" y="408" width="200" height="6" rx="3" fill="#4b7cad"/>
  <text x="320" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fff">NAU 7</text>
  <rect x="116" y="512" width="178" height="198" fill="#5f6b76"/>
  <rect x="120" y="518" width="170" height="192" fill="url(#persiana)"/>
  <rect x="336" y="512" width="178" height="198" fill="#5f6b76"/>
  <rect x="340" y="518" width="170" height="192" fill="url(#persiana)"/>
  <rect x="340" y="660" width="170" height="50" fill="#1f252b" opacity="0.8"/>
  <g fill="#f2c200"><rect x="116" y="700" width="10" height="10"/><rect x="284" y="700" width="10" height="10"/><rect x="336" y="700" width="10" height="10"/><rect x="504" y="700" width="10" height="10"/></g>

  <!-- nau 2 -->
  <rect x="700" y="430" width="440" height="280" fill="#dccaa0"/>
  <rect x="1060" y="430" width="80" height="280" fill="#c9b68b"/>
  <polygon points="690,432 920,388 1150,432" fill="#b9a67d"/>
  <polygon points="920,388 1150,432 1060,432" fill="#a59167"/>
  <rect x="700" y="468" width="440" height="32" fill="#2f5d8a"/>
  <rect x="700" y="468" width="440" height="5" fill="#4b7cad"/>
  <text x="880" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#fff" letter-spacing="3">TRANSPORTS LA PLANA</text>
  <rect x="756" y="556" width="148" height="154" fill="#6b5e4a"/>
  <rect x="760" y="560" width="140" height="150" fill="url(#persiana)"/>
  <rect x="950" y="590" width="60" height="120" fill="#6d5b44"/>
  <rect x="950" y="590" width="60" height="6" fill="#56472f"/>
  <circle cx="998" cy="652" r="3" fill="#e0c690"/>
  <rect x="1040" y="540" width="70" height="44" fill="#6e5f47"/>
  <rect x="1044" y="544" width="62" height="36" fill="url(#vidre)"/>
  <rect x="1074" y="544" width="3" height="36" fill="#6e5f47"/>

  <!-- xemeneia -->
  <rect x="1250" y="200" width="62" height="510" fill="#9b5c4b"/>
  <rect x="1290" y="200" width="22" height="510" fill="#7f4839"/>
  <g fill="#f1efe9"><rect x="1250" y="230" width="62" height="24"/><rect x="1250" y="290" width="62" height="24"/></g>
  <g fill="#d3d0c8"><rect x="1290" y="230" width="22" height="24"/><rect x="1290" y="290" width="22" height="24"/></g>
  <rect x="1242" y="194" width="78" height="14" fill="#6e4034"/>
  <circle cx="1281" cy="196" r="4" fill="#e04b3a"/>

  <!-- nau 3 -->
  <rect x="1180" y="500" width="420" height="210" fill="url(#xapaB)"/>
  <rect x="1180" y="492" width="420" height="12" fill="#6f806f"/>
  <rect x="1356" y="566" width="178" height="144" fill="#5f6b5f"/>
  <rect x="1360" y="570" width="170" height="140" fill="url(#persiana)"/>
  <!-- moll de càrrega amb camió -->
  <rect x="1210" y="600" width="120" height="110" fill="#e7e2d6"/>
  <rect x="1210" y="600" width="120" height="10" fill="#c9c3b3"/>
  <text x="1270" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#c0392b">PLANA</text>
  <g fill="#2a2d31"><circle cx="1234" cy="712" r="12"/><circle cx="1306" cy="712" r="12"/></g>

  <!-- palets i bidons -->
  <use href="#palet" x="540" y="668" width="80" height="40"/>
  <use href="#palet" x="548" y="638" width="72" height="36"/>
  <g>
    <rect x="1140" y="660" width="30" height="50" rx="3" fill="#2f6f9e"/><rect x="1140" y="672" width="30" height="4" fill="#23577d"/><rect x="1140" y="690" width="30" height="4" fill="#23577d"/>
    <rect x="1166" y="666" width="28" height="44" rx="3" fill="#c7442f"/><rect x="1166" y="678" width="28" height="4" fill="#9a3322"/>
  </g>

  <!-- tanca metàl·lica -->
  <rect y="662" width="1600" height="50" fill="url(#reixa)"/>
  <g stroke="#5d656e" stroke-width="3">
    <line x1="0" y1="662" x2="1600" y2="662"/><line x1="0" y1="712" x2="1600" y2="712"/>
  </g>
  <g fill="#5d656e"><rect x="20" y="656" width="5" height="58"/><rect x="330" y="656" width="5" height="58"/><rect x="820" y="656" width="5" height="58"/><rect x="1440" y="656" width="5" height="58"/></g>
  <g fill="#7d9a52"><path d="M180 712 q5 -18 9 0 q4 -12 8 0 z"/><path d="M880 712 q5 -18 9 0 q4 -12 8 0 z"/><path d="M1520 712 q5 -18 9 0 q4 -12 8 0 z"/></g>

  <use href="#fanal" x="640" y="420" width="60" height="300"/>
  <use href="#fanal" x="1150" y="420" width="60" height="300"/>

  <!-- vorera -->
  <rect y="712" width="1600" height="30" fill="#a9acaf"/>
  <g stroke="#8f9296" stroke-width="2"><path d="M100 712 V742 M300 712 V742 M500 712 V742 M700 712 V742 M900 712 V742 M1100 712 V742 M1300 712 V742 M1500 712 V742"/></g>
  <!-- carretera -->
  <rect y="740" width="1600" height="160" fill="url(#asfalt)"/>
  <rect y="740" width="1600" height="160" fill="url(#gra)"/>
  <rect y="740" width="1600" height="7" fill="#d4d4d2"/>
  <rect y="747" width="1600" height="6" fill="#000" opacity="0.22"/>
  <line x1="0" y1="826" x2="1600" y2="826" stroke="#f0efe8" stroke-width="7" stroke-dasharray="70 55" opacity="0.85"/>
  <!-- pedaços, esquerdes, taques d'oli i clavegueram -->
  <rect x="860" y="772" width="140" height="40" fill="#2f3236" opacity="0.6"/>
  <path d="M220 850 l30 8 l18 -10 l26 12 M1320 790 l20 12 l24 -6" stroke="#2b2e31" stroke-width="2" fill="none"/>
  <ellipse cx="420" cy="870" rx="60" ry="10" fill="#2c2f33"/><ellipse cx="424" cy="868" rx="30" ry="4" fill="#6b5f7c" opacity="0.35"/>
  <ellipse cx="1180" cy="790" rx="45" ry="8" fill="#2c2f33"/>
  <ellipse cx="640" cy="866" rx="34" ry="9" fill="#34383c" stroke="#26292c" stroke-width="3"/>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
