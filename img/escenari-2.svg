<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Polígon industrial: naus, xemeneia i fum -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9cab"/>
      <stop offset="1" stop-color="#dfe3e7"/>
    </linearGradient>
    <pattern id="xapa" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#b7c1cb"/>
      <rect width="3" height="18" fill="#a3aeb9"/>
    </pattern>
    <pattern id="persiana" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="#6f7d8a"/>
      <rect y="10" width="10" height="2" fill="#5d6a76"/>
    </pattern>
    <symbol id="fanal" viewBox="0 0 60 300">
      <rect x="27" y="20" width="6" height="280" fill="#4b5058"/>
      <path d="M30 22 Q30 8 50 8 L56 8" stroke="#4b5058" stroke-width="5" fill="none"/>
      <rect x="44" y="6" width="16" height="8" rx="2" fill="#f1e7b0"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- fum -->
  <g fill="#c7cbd0" opacity="0.8">
    <ellipse cx="1300" cy="170" rx="60" ry="40"/><ellipse cx="1360" cy="120" rx="80" ry="50"/>
    <ellipse cx="1450" cy="80" rx="110" ry="55"/><ellipse cx="1560" cy="60" rx="120" ry="50"/>
  </g>

  <!-- naus del fons -->
  <rect x="0" y="470" width="1600" height="240" fill="#a9b3bb"/>
  <path d="M0 470 L60 430 L60 470 L120 430 L120 470 L180 430 L180 470 L240 430 L240 470 Z" fill="#98a3ad"/>

  <!-- nau 1 -->
  <rect x="60" y="370" width="560" height="340" fill="url(#xapa)"/>
  <path d="M60 370 L140 320 L140 370 L220 320 L220 370 L300 320 L300 370 L380 320 L380 370 L460 320 L460 370 L540 320 L540 370 L620 320 L620 370 Z" fill="#8d99a5"/>
  <rect x="120" y="520" width="170" height="190" fill="url(#persiana)"/>
  <rect x="340" y="520" width="170" height="190" fill="url(#persiana)"/>
  <rect x="220" y="410" width="200" height="54" fill="#2f5d8a"/>
  <text x="320" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fff">NAU 7</text>

  <!-- nau 2 -->
  <rect x="700" y="430" width="440" height="280" fill="#dccaa0"/>
  <rect x="700" y="470" width="440" height="30" fill="#2f5d8a"/>
  <polygon points="690,432 920,390 1150,432" fill="#b9a67d"/>
  <rect x="760" y="560" width="140" height="150" fill="url(#persiana)"/>
  <rect x="950" y="590" width="60" height="120" fill="#6d5b44"/>
  <rect x="1040" y="540" width="60" height="40" fill="#9dc0dc"/>

  <!-- xemeneia -->
  <rect x="1250" y="200" width="62" height="510" fill="#9b5c4b"/>
  <g fill="#f1efe9">
    <rect x="1250" y="230" width="62" height="24"/><rect x="1250" y="290" width="62" height="24"/>
  </g>
  <rect x="1242" y="196" width="78" height="14" fill="#6e4034"/>

  <!-- nau 3 -->
  <rect x="1180" y="500" width="420" height="210" fill="#9fb09f"/>
  <rect x="1180" y="492" width="420" height="12" fill="#7b8b7b"/>
  <rect x="1360" y="570" width="170" height="140" fill="url(#persiana)"/>

  <!-- tanca -->
  <g stroke="#6b737c" stroke-width="3">
    <line x1="0" y1="690" x2="1600" y2="690"/>
    <line x1="0" y1="712" x2="1600" y2="712"/>
  </g>

  <use href="#fanal" x="640" y="420" width="60" height="300"/>
  <use href="#fanal" x="1150" y="420" width="60" height="300"/>

  <!-- vorera i carretera -->
  <rect y="712" width="1600" height="36" fill="#a4a7aa"/>
  <rect y="740" width="1600" height="160" fill="#474b50"/>
  <rect y="740" width="1600" height="6" fill="#d8d8d8"/>
  <line x1="0" y1="826" x2="1600" y2="826" stroke="#f3f3f3" stroke-width="7" stroke-dasharray="70 55"/>
  <!-- taques d'oli -->
  <ellipse cx="420" cy="870" rx="60" ry="10" fill="#34373b"/>
  <ellipse cx="1180" cy="790" rx="45" ry="8" fill="#34373b"/>
</svg>
