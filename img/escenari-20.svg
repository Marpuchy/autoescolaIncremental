<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- DGT: examen pràctic. El centre d'exàmens, la pista de pràctiques amb cons, places d'aparcament marcades, banderes i el semàfor de la prova -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9fd8"/><stop offset="0.6" stop-color="#a6d4ee"/><stop offset="0.85" stop-color="#eef7fb"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5e63"/><stop offset="1" stop-color="#3c3f44"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.1"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.08"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#101a24" stop-opacity="0.35"/>
    </radialGradient>
    <symbol id="con" viewBox="0 0 40 50">
      <path d="M12 6 H28 L36 44 H4 Z" fill="#ff7a1a"/><path d="M10 18 H30 L32 26 H8 Z M7 32 H33 L34 38 H6 Z" fill="#fff"/>
      <rect x="0" y="44" width="40" height="6" rx="2" fill="#d9541e"/>
    </symbol>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="300" cy="110" rx="100" ry="16"/><ellipse cx="1260" cy="140" rx="90" ry="14"/></g>
  <path d="M0 460 Q300 410 600 440 Q900 400 1200 440 Q1420 420 1600 450 V605 H0 Z" fill="#a4b6a0"/>
  <!-- el centre d'exàmens -->
  <g>
    <rect x="380" y="330" width="560" height="270" fill="#e9ecef"/><rect x="380" y="316" width="560" height="18" fill="#2d4f8a"/>
    <rect x="400" y="350" width="520" height="70" fill="#5f8fb4"/>
    <g stroke="#e9ecef" stroke-width="6"><path d="M480 350 V420 M560 350 V420 M640 350 V420 M720 350 V420 M800 350 V420 M880 350 V420"/></g>
    <rect x="560" y="470" width="200" height="130" fill="#5f8fb4"/><rect x="656" y="470" width="8" height="130" fill="#e9ecef"/>
    <rect x="520" y="430" width="280" height="34" rx="4" fill="#2d4f8a"/>
    <text x="660" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#fff" letter-spacing="2">CENTRE D'EXÀMENS</text>
    <!-- marquesina de l'entrada, tiradors, parterres i la cua d'aspirants esperant l'examinador -->
    <rect x="540" y="462" width="240" height="10" rx="2" fill="#2d4f8a"/><rect x="540" y="472" width="240" height="4" fill="#1a1a4e" opacity="0.2"/>
    <rect x="646" y="520" width="4" height="26" rx="2" fill="#c9ced4"/><rect x="670" y="520" width="4" height="26" rx="2" fill="#c9ced4"/>
    <rect x="380" y="330" width="560" height="270" fill="#1a1a4e" opacity="0.05"/><rect x="920" y="334" width="20" height="266" fill="#1a1a4e" opacity="0.1"/>
    <g fill="#3f8a3f"><circle cx="420" cy="584" r="22"/><circle cx="452" cy="590" r="16"/><circle cx="900" cy="584" r="22"/><circle cx="868" cy="590" r="16"/></g>
    <g fill="#2f6b33"><circle cx="428" cy="592" r="12"/><circle cx="894" cy="592" r="12"/></g>
    <rect x="396" y="594" width="72" height="8" fill="#9aa0a6"/><rect x="852" y="594" width="72" height="8" fill="#9aa0a6"/>
    <g>
      <circle cx="800" cy="536" r="9" fill="#f0c8a0"/><path d="M790 534 Q792 524 802 526 Q810 528 808 536 Q802 530 790 534 Z" fill="#3a2a1a"/>
      <path d="M788 600 V560 Q788 548 800 548 Q812 548 812 560 V600 Z" fill="#f28c28"/>
      <circle cx="830" cy="540" r="9" fill="#e8b890"/><path d="M821 538 Q822 528 832 529 Q840 531 839 540 Q832 534 821 538 Z" fill="#f2d27a"/>
      <path d="M818 600 V562 Q818 552 830 552 Q842 552 842 562 V600 Z" fill="#3a7bd5"/>
      <circle cx="736" cy="534" r="9" fill="#efc6a2"/><path d="M727 530 Q736 520 745 530 Z" fill="#c9c9c9"/>
      <path d="M724 600 V558 Q724 546 736 546 Q748 546 748 558 V600 Z" fill="#4a5568"/>
      <rect x="742" y="560" width="14" height="18" rx="1" fill="#b88a4a"/><rect x="744" y="563" width="10" height="13" fill="#fff"/>
    </g>
    <rect x="410" y="250" width="150" height="66" rx="6" fill="#2d4f8a"/>
    <text x="485" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fff">DGT</text>
  </g>
  <!-- pals de bandera -->
  <g>
    <rect x="1000" y="240" width="6" height="360" fill="#9aa0a6"/><rect x="1060" y="260" width="6" height="340" fill="#9aa0a6"/>
    <path d="M1006 244 Q1030 238 1052 250 Q1030 262 1006 270 Z" fill="#f2c200"/><g fill="#d1261f"><rect x="1010" y="246" width="40" height="3"/><rect x="1010" y="254" width="40" height="3"/><rect x="1010" y="262" width="34" height="3"/></g>
    <path d="M1066 264 Q1090 258 1112 270 Q1090 282 1066 290 Z" fill="#1f4fa8"/><circle cx="1088" cy="276" r="7" fill="none" stroke="#f2c200" stroke-width="2" stroke-dasharray="2 3"/>
  </g>
  <!-- zona de pràctiques: aparcament marcat i cons -->
  <rect y="600" width="1600" height="100" fill="#62666b"/>
  <g stroke="#f3f1e6" stroke-width="5"><path d="M1140 610 V690 M1240 610 V690 M1340 610 V690 M1440 610 V690 M1140 610 H1440"/></g>
  <!-- cotxe de l'autoescola aparcat a la plaça de la prova (abans era un rectangle verd sense forma) -->
  <g>
    <path d="M1252 682 V668 Q1252 660 1260 659 L1270 658 L1280 646 Q1282 644 1286 644 H1306 Q1310 644 1313 647 L1322 658 Q1330 659 1330 667 V682 Z" fill="#f4f6f8"/>
    <path d="M1273 658 L1282 648 H1294 V658 Z M1297 648 H1308 L1316 658 H1297 Z" fill="#a8d8ef"/>
    <rect x="1252" y="672" width="78" height="10" fill="#1a1a4e" opacity="0.15"/>
    <rect x="1284" y="636" width="16" height="8" rx="1.5" fill="#1f4f9e"/><path d="M1289 638 V642 H1295" stroke="#fff" stroke-width="1.6" fill="none"/>
    <circle cx="1268" cy="682" r="8" fill="#23232b"/><circle cx="1268" cy="682" r="4" fill="#9aa3ad"/>
    <circle cx="1314" cy="682" r="8" fill="#23232b"/><circle cx="1314" cy="682" r="4" fill="#9aa3ad"/>
  </g>
  <use href="#con" x="140" y="640" width="40" height="50"/><use href="#con" x="240" y="640" width="40" height="50"/><use href="#con" x="340" y="640" width="40" height="50"/>
  <use href="#con" x="1180" y="640" width="36" height="46"/><use href="#con" x="1380" y="640" width="36" height="46"/>
  <!-- semàfor de la prova -->
  <g><rect x="1520" y="520" width="8" height="180" fill="#2e3136"/><rect x="1504" y="440" width="40" height="90" rx="6" fill="#1d2329"/>
    <circle cx="1524" cy="458" r="10" fill="#4a1010"/><circle cx="1524" cy="485" r="10" fill="#4a3a10"/><circle cx="1524" cy="512" r="10" fill="#2fdc5a"/></g>
  <!-- circuit de l'examen -->
  <rect y="700" width="1600" height="200" fill="url(#asfalt)"/><rect y="700" width="1600" height="200" fill="url(#gra)"/>
  <rect y="704" width="1600" height="5" fill="#f3f1e6"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#f3f1e6" stroke-width="6" stroke-dasharray="60 60" opacity="0.9"/>
  <g fill="#f3f1e6"><rect x="600" y="716" width="8" height="70"/><text x="700" y="770" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#f3f1e6" opacity="0.8">STOP</text></g>
  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
