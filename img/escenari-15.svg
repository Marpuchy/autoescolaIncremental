<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- AP-7 (sense peatges): autopista amb pòrtic de senyals blaus, l'antic peatge abandonat amb un "GRATUÏT", tarongerars i muntanyes -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fd0"/><stop offset="0.6" stop-color="#9ccbec"/><stop offset="0.85" stop-color="#eaf5fb"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5e63"/><stop offset="1" stop-color="#3a3d42"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.1"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.08"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
    </pattern>
    <pattern id="tarongers" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#7aa35a"/><circle cx="15" cy="14" r="12" fill="#2f6b33"/><circle cx="45" cy="16" r="12" fill="#357a38"/>
      <circle cx="12" cy="12" r="2" fill="#f5901f"/><circle cx="48" cy="14" r="2" fill="#f5901f"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#101a24" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="420" cy="110" rx="110" ry="18"/><ellipse cx="1180" cy="150" rx="90" ry="14"/></g>
  <path d="M0 430 Q180 330 360 390 Q560 300 760 380 Q960 310 1160 380 Q1380 320 1600 400 V560 H0 Z" fill="#9aa9a6"/>
  <path d="M0 480 Q300 430 600 470 Q900 420 1200 470 Q1420 440 1600 470 V560 H0 Z" fill="#88a084"/>
  <!-- tarongerars -->
  <rect y="520" width="1600" height="120" fill="url(#tarongers)"/>
  <!-- l'antic peatge, abandonat -->
  <g>
    <rect x="160" y="470" width="420" height="24" fill="#d1261f"/><rect x="160" y="494" width="420" height="10" fill="#9a1b16"/>
    <text x="370" y="489" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#fff" letter-spacing="4">PEATGE</text>
    <g fill="#d6dade"><rect x="180" y="504" width="20" height="150"/><rect x="300" y="504" width="20" height="150"/><rect x="420" y="504" width="20" height="150"/><rect x="540" y="504" width="20" height="150"/></g>
    <g fill="#eef1f3"><rect x="220" y="580" width="56" height="74"/><rect x="340" y="580" width="56" height="74"/><rect x="460" y="580" width="56" height="74"/></g>
    <g fill="#5f7486"><rect x="228" y="590" width="40" height="26"/><rect x="348" y="590" width="40" height="26"/><rect x="468" y="590" width="40" height="26"/></g>
    <!-- barreres alçades per sempre -->
    <g stroke="#d1261f" stroke-width="6"><line x1="276" y1="620" x2="296" y2="540"/><line x1="396" y1="620" x2="416" y2="540"/></g>
    <rect x="300" y="430" width="140" height="34" rx="4" fill="#2fa84f"/>
    <text x="370" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#fff">GRATUÏT</text>
  </g>
  <!-- pòrtic de senyals de l'autopista -->
  <g>
    <rect x="760" y="300" width="14" height="400" fill="#8a9096"/><rect x="1500" y="300" width="14" height="400" fill="#8a9096"/>
    <rect x="760" y="300" width="754" height="14" fill="#8a9096"/>
    <rect x="800" y="320" width="320" height="110" rx="6" fill="#1f5fae" stroke="#fff" stroke-width="4"/>
    <rect x="1150" y="320" width="320" height="110" rx="6" fill="#1f5fae" stroke="#fff" stroke-width="4"/>
    <g font-family="Arial, sans-serif" font-weight="bold" fill="#fff">
      <rect x="820" y="336" width="58" height="30" rx="4" fill="#d1261f"/><text x="849" y="358" text-anchor="middle" font-size="18">AP-7</text>
      <text x="900" y="360" font-size="24">València</text><text x="900" y="404" font-size="22">Sagunt</text>
      <rect x="1170" y="336" width="58" height="30" rx="4" fill="#d1261f"/><text x="1199" y="358" text-anchor="middle" font-size="18">AP-7</text>
      <text x="1250" y="360" font-size="24">Barcelona</text><text x="1250" y="404" font-size="22">Castelló</text>
    </g>
    <path d="M1080 418 L1096 400 L1112 418 Z M1430 418 L1446 400 L1462 418 Z" fill="#fff"/>
  </g>
  <!-- bionda -->
  <rect y="640" width="1600" height="10" fill="#c9ced3"/><rect y="650" width="1600" height="4" fill="#8a9096"/>
  <g fill="#8a9096"><rect x="40" y="640" width="6" height="60"/><rect x="340" y="640" width="6" height="60"/><rect x="640" y="640" width="6" height="60"/><rect x="940" y="640" width="6" height="60"/><rect x="1240" y="640" width="6" height="60"/><rect x="1540" y="640" width="6" height="60"/></g>
  <rect y="654" width="1600" height="46" fill="#a8a07a"/>
  <!-- autopista: tres carrils -->
  <rect y="700" width="1600" height="200" fill="url(#asfalt)"/><rect y="700" width="1600" height="200" fill="url(#gra)"/>
  <rect y="704" width="1600" height="5" fill="#f3f1e6"/>
  <line x1="0" y1="770" x2="1600" y2="770" stroke="#f3f1e6" stroke-width="5" stroke-dasharray="90 70"/>
  <line x1="0" y1="836" x2="1600" y2="836" stroke="#f3f1e6" stroke-width="5" stroke-dasharray="90 70"/>
  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
