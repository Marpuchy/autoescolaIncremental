<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Afores de Castelló: tarongers, el Fadrí i el Desert de les Palmes al fons -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f29e5c"/>
      <stop offset="0.6" stop-color="#fbd49a"/>
      <stop offset="1" stop-color="#fdebc8"/>
    </linearGradient>
    <symbol id="taronger" viewBox="0 0 100 100">
      <rect x="45" y="62" width="10" height="38" fill="#6b4a2f"/>
      <circle cx="50" cy="44" r="38" fill="#2f6b33"/>
      <circle cx="36" cy="36" r="20" fill="#387a3b"/>
      <g fill="#f28c28">
        <circle cx="30" cy="48" r="6"/><circle cx="58" cy="30" r="6"/><circle cx="68" cy="54" r="6"/>
        <circle cx="44" cy="62" r="5"/><circle cx="46" cy="20" r="5"/><circle cx="76" cy="38" r="5"/>
      </g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="330" cy="360" r="95" fill="#ffd27a" opacity="0.95"/>
  <circle cx="330" cy="360" r="140" fill="#ffd27a" opacity="0.25"/>

  <!-- Desert de les Palmes -->
  <path d="M0 470 L120 380 L230 420 L360 310 L480 400 L600 350 L760 450 L760 900 H0 Z" fill="#9b7a9f"/>
  <path d="M0 520 L150 440 L300 480 L450 420 L620 490 L760 470 V900 H0 Z" fill="#86688c"/>

  <!-- ciutat al fons -->
  <g fill="#c79d82">
    <rect x="760" y="440" width="80" height="140"/><rect x="850" y="400" width="60" height="180"/>
    <rect x="920" y="460" width="110" height="120"/><rect x="1190" y="420" width="90" height="160"/>
    <rect x="1290" y="470" width="120" height="110"/><rect x="1420" y="430" width="70" height="150"/>
    <rect x="1500" y="480" width="100" height="100"/>
  </g>
  <g fill="#b38a70">
    <rect x="1040" y="480" width="60" height="100"/><rect x="700" y="490" width="70" height="90"/>
  </g>
  <!-- el Fadrí -->
  <rect x="1115" y="250" width="54" height="330" fill="#e2c396"/>
  <rect x="1110" y="300" width="64" height="8" fill="#c9a676"/>
  <rect x="1110" y="400" width="64" height="8" fill="#c9a676"/>
  <rect x="1122" y="206" width="40" height="48" fill="#e2c396"/>
  <rect x="1132" y="216" width="8" height="22" fill="#7a5a3f"/><rect x="1146" y="216" width="8" height="22" fill="#7a5a3f"/>
  <rect x="1117" y="198" width="50" height="10" fill="#c9a676"/>
  <rect x="1136" y="178" width="12" height="22" fill="#c9a676"/>

  <!-- camp de tarongers -->
  <rect y="560" width="1600" height="200" fill="#c7a466"/>
  <g>
    <use href="#taronger" x="-20" y="540" width="110" height="110"/><use href="#taronger" x="110" y="540" width="110" height="110"/>
    <use href="#taronger" x="240" y="540" width="110" height="110"/><use href="#taronger" x="370" y="540" width="110" height="110"/>
    <use href="#taronger" x="500" y="540" width="110" height="110"/><use href="#taronger" x="630" y="540" width="110" height="110"/>
    <use href="#taronger" x="760" y="540" width="110" height="110"/><use href="#taronger" x="890" y="540" width="110" height="110"/>
    <use href="#taronger" x="1020" y="540" width="110" height="110"/><use href="#taronger" x="1150" y="540" width="110" height="110"/>
    <use href="#taronger" x="1280" y="540" width="110" height="110"/><use href="#taronger" x="1410" y="540" width="110" height="110"/>
    <use href="#taronger" x="1540" y="540" width="110" height="110"/>
  </g>
  <g>
    <use href="#taronger" x="40" y="600" width="140" height="140"/><use href="#taronger" x="240" y="600" width="140" height="140"/>
    <use href="#taronger" x="440" y="600" width="140" height="140"/><use href="#taronger" x="640" y="600" width="140" height="140"/>
    <use href="#taronger" x="840" y="600" width="140" height="140"/><use href="#taronger" x="1040" y="600" width="140" height="140"/>
    <use href="#taronger" x="1240" y="600" width="140" height="140"/><use href="#taronger" x="1440" y="600" width="140" height="140"/>
  </g>

  <!-- séquia i carretera -->
  <rect y="728" width="1600" height="12" fill="#6fa3c2"/>
  <rect y="740" width="1600" height="160" fill="#5a5e63"/>
  <rect y="740" width="1600" height="7" fill="#e8e0c8"/>
  <line x1="0" y1="826" x2="1600" y2="826" stroke="#f3f3f3" stroke-width="7" stroke-dasharray="70 55"/>
</svg>
