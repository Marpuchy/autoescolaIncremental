<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Afores de Castelló al capvespre: tarongerars, el Fadrí i el Desert de les Palmes al fons -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5a9a"/>
      <stop offset="0.32" stop-color="#e88a6a"/>
      <stop offset="0.58" stop-color="#fbc27d"/>
      <stop offset="0.72" stop-color="#fde3b4"/>
    </linearGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fff4c9"/>
      <stop offset="0.2" stop-color="#ffd784" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd8a4" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbd8a4" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa56a"/>
      <stop offset="1" stop-color="#a97f48"/>
    </linearGradient>
    <linearGradient id="aigua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c585"/>
      <stop offset="1" stop-color="#6d8fb0"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f5d60"/>
      <stop offset="1" stop-color="#46454a"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.12"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.1"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
      <circle cx="12" cy="31" r="1" fill="#000" opacity="0.2"/>
    </pattern>
    <pattern id="finestres" width="26" height="30" patternUnits="userSpaceOnUse">
      <rect width="26" height="30" fill="#c08f76"/>
      <rect x="8" y="9" width="9" height="11" fill="#ffd98a"/>
    </pattern>
    <pattern id="finestresB" width="26" height="30" patternUnits="userSpaceOnUse">
      <rect width="26" height="30" fill="#a97a66"/>
      <rect x="8" y="9" width="9" height="11" fill="#7d5a4f"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1420" stop-opacity="0.42"/>
    </radialGradient>
    <!-- taronger il·luminat des de l'esquerra, amb l'ombra allargada cap a la dreta -->
    <symbol id="taronger" viewBox="0 0 160 110">
      <ellipse cx="100" cy="104" rx="60" ry="6" fill="#5a3b1c" opacity="0.35"/>
      <rect x="45" y="66" width="10" height="40" fill="#5e3f26"/>
      <circle cx="50" cy="46" r="40" fill="#285e2e"/>
      <circle cx="40" cy="38" r="28" fill="#347538"/>
      <circle cx="30" cy="32" r="14" fill="#4a8d45"/>
      <path d="M12 40 Q14 12 44 8 Q24 20 20 44 Z" fill="#e7b25a" opacity="0.45"/>
      <g fill="#f5901f">
        <circle cx="28" cy="52" r="6"/><circle cx="58" cy="30" r="6"/><circle cx="70" cy="56" r="6"/>
        <circle cx="44" cy="66" r="5"/><circle cx="46" cy="20" r="5"/><circle cx="80" cy="40" r="5"/>
      </g>
      <g fill="#ffd08a"><circle cx="26" cy="50" r="2"/><circle cx="56" cy="28" r="2"/><circle cx="44" cy="18" r="1.6"/></g>
    </symbol>
    <symbol id="palmera" viewBox="0 0 120 260">
      <path d="M58 260 Q54 160 62 60" stroke="#6b4e34" stroke-width="12" fill="none"/>
      <g fill="#2f6a34">
        <path d="M62 60 Q20 40 0 70 Q30 52 62 64Z"/><path d="M62 60 Q100 36 120 66 Q92 50 62 64Z"/>
        <path d="M62 58 Q40 10 12 20 Q44 24 60 62Z"/><path d="M62 58 Q86 8 112 22 Q80 26 64 62Z"/>
        <path d="M62 56 Q62 20 64 0 Q70 30 64 60Z"/>
      </g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="330" cy="380" r="260" fill="url(#sol)"/>
  <circle cx="330" cy="380" r="70" fill="#fff0c4"/>

  <!-- núvols il·luminats per baix -->
  <g>
    <g fill="#8a6f9e" opacity="0.8"><ellipse cx="900" cy="130" rx="170" ry="22"/><ellipse cx="1320" cy="210" rx="140" ry="18"/><ellipse cx="560" cy="90" rx="120" ry="16"/></g>
    <g fill="#ffb07a"><ellipse cx="890" cy="142" rx="150" ry="9"/><ellipse cx="1310" cy="222" rx="120" ry="8"/><ellipse cx="552" cy="100" rx="100" ry="7"/></g>
  </g>

  <!-- Desert de les Palmes -->
  <path d="M0 470 L120 384 L230 420 L360 312 L480 402 L600 352 L760 450 L920 510 V620 H0 Z" fill="#a07fa8"/>
  <g fill="#fbc8a0" opacity="0.55">
    <polygon points="120,384 160,410 120,440 90,410"/><polygon points="360,312 300,370 330,380"/><polygon points="600,352 560,390 590,392"/>
  </g>
  <g fill="#86689a"><polygon points="360,312 480,402 440,620 380,620"/><polygon points="120,384 230,420 200,620 140,620"/><polygon points="600,352 760,450 700,620 610,620"/></g>
  <!-- antenes del Bartolo -->
  <g stroke="#6d5480" stroke-width="3"><line x1="360" y1="312" x2="360" y2="272"/><line x1="372" y1="318" x2="372" y2="290"/></g>
  <path d="M0 524 L150 446 L300 484 L450 424 L620 492 L760 472 L920 520 V620 H0 Z" fill="#7d6190"/>
  <rect y="430" width="1600" height="190" fill="url(#boira)"/>

  <!-- la ciutat -->
  <g>
    <rect x="690" y="488" width="80" height="92" fill="url(#finestresB)"/>
    <rect x="760" y="440" width="80" height="140" fill="url(#finestres)"/>
    <rect x="850" y="400" width="62" height="180" fill="url(#finestres)"/>
    <rect x="920" y="458" width="110" height="122" fill="url(#finestresB)"/>
    <rect x="1040" y="480" width="60" height="100" fill="url(#finestres)"/>
    <rect x="1190" y="420" width="90" height="160" fill="url(#finestres)"/>
    <rect x="1290" y="470" width="120" height="110" fill="url(#finestresB)"/>
    <rect x="1420" y="430" width="72" height="150" fill="url(#finestres)"/>
    <rect x="1500" y="480" width="100" height="100" fill="url(#finestresB)"/>
    <!-- costat en ombra de cada bloc -->
    <g fill="#5b3a3a" opacity="0.3">
      <rect x="824" y="440" width="16" height="140"/><rect x="896" y="400" width="16" height="180"/><rect x="1264" y="420" width="16" height="160"/>
      <rect x="1476" y="430" width="16" height="150"/><rect x="1086" y="480" width="14" height="100"/>
    </g>
    <g fill="#8a5d55"><rect x="758" y="434" width="84" height="6"/><rect x="848" y="394" width="66" height="6"/><rect x="1188" y="414" width="94" height="6"/><rect x="1418" y="424" width="76" height="6"/></g>
  </g>
  <!-- el Fadrí -->
  <g>
    <rect x="1115" y="250" width="54" height="330" fill="#ebcd9c"/>
    <rect x="1148" y="250" width="21" height="330" fill="#c9a576"/>
    <g fill="#c9a676"><rect x="1110" y="300" width="64" height="8"/><rect x="1110" y="400" width="64" height="8"/><rect x="1110" y="500" width="64" height="8"/></g>
    <g fill="#a98659"><rect x="1150" y="300" width="24" height="8"/><rect x="1150" y="400" width="24" height="8"/><rect x="1150" y="500" width="24" height="8"/></g>
    <rect x="1122" y="206" width="40" height="48" fill="#ebcd9c"/>
    <rect x="1148" y="206" width="14" height="48" fill="#c9a576"/>
    <path d="M1130 238 V222 Q1135 214 1140 222 V238 Z M1144 238 V222 Q1149 214 1154 222 V238 Z" fill="#6b4a33"/>
    <rect x="1117" y="198" width="50" height="10" fill="#c9a676"/>
    <rect x="1134" y="178" width="16" height="22" fill="#d8b684"/>
    <path d="M1134 180 Q1142 164 1150 180 Z" fill="#c9a676"/>
    <rect x="1141" y="154" width="2" height="16" fill="#6b4a33"/>
    <rect x="1128" y="330" width="8" height="18" fill="#8a6848"/><rect x="1128" y="430" width="8" height="18" fill="#8a6848"/>
  </g>

  <!-- tarongerar -->
  <rect y="560" width="1600" height="200" fill="url(#terra)"/>
  <g stroke="#b3884f" stroke-width="3" opacity="0.6">
    <line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="660" x2="1600" y2="660"/><line x1="0" y1="720" x2="1600" y2="720"/>
  </g>
  <!-- alqueria amb palmera -->
  <g>
    <rect x="1290" y="520" width="120" height="60" fill="#f2e2c4"/>
    <rect x="1370" y="520" width="40" height="60" fill="#d8c29c"/>
    <polygon points="1284,522 1350,494 1416,522" fill="#b8633f"/>
    <rect x="1340" y="546" width="18" height="34" fill="#6b4a33"/><rect x="1304" y="540" width="16" height="14" fill="#4f6a86"/>
    <use href="#palmera" x="1414" y="400" width="80" height="176"/>
  </g>
  <g>
    <use href="#taronger" x="-20" y="536" width="160" height="110"/><use href="#taronger" x="110" y="536" width="160" height="110"/>
    <use href="#taronger" x="240" y="536" width="160" height="110"/><use href="#taronger" x="370" y="536" width="160" height="110"/>
    <use href="#taronger" x="500" y="536" width="160" height="110"/><use href="#taronger" x="630" y="536" width="160" height="110"/>
    <use href="#taronger" x="760" y="536" width="160" height="110"/><use href="#taronger" x="890" y="536" width="160" height="110"/>
    <use href="#taronger" x="1020" y="536" width="160" height="110"/><use href="#taronger" x="1150" y="536" width="160" height="110"/>
    <use href="#taronger" x="1540" y="536" width="160" height="110"/>
  </g>
  <g>
    <use href="#taronger" x="40" y="596" width="204" height="140"/><use href="#taronger" x="240" y="596" width="204" height="140"/>
    <use href="#taronger" x="440" y="596" width="204" height="140"/><use href="#taronger" x="640" y="596" width="204" height="140"/>
    <use href="#taronger" x="840" y="596" width="204" height="140"/><use href="#taronger" x="1040" y="596" width="204" height="140"/>
    <use href="#taronger" x="1240" y="596" width="204" height="140"/><use href="#taronger" x="1440" y="596" width="204" height="140"/>
  </g>

  <!-- séquia amb el reflex del cel -->
  <rect y="724" width="1600" height="16" fill="url(#aigua)"/>
  <rect y="722" width="1600" height="3" fill="#8a6a44"/>
  <g stroke="#ffe0ad" stroke-width="2" opacity="0.8"><line x1="150" y1="730" x2="210" y2="730"/><line x1="700" y1="733" x2="760" y2="733"/><line x1="1220" y1="730" x2="1290" y2="730"/></g>

  <!-- carretera -->
  <rect y="740" width="1600" height="160" fill="url(#asfalt)"/>
  <rect y="740" width="1600" height="160" fill="url(#gra)"/>
  <rect y="740" width="1600" height="7" fill="#e8d9b8"/>
  <rect y="747" width="1600" height="6" fill="#000" opacity="0.2"/>
  <rect y="762" width="1600" height="4" fill="#f4e6cc" opacity="0.8"/>
  <line x1="0" y1="826" x2="1600" y2="826" stroke="#f7ecd8" stroke-width="7" stroke-dasharray="70 55" opacity="0.9"/>
  <rect y="884" width="1600" height="4" fill="#f4e6cc" opacity="0.8"/>
  <!-- llum càlida del capvespre -->
  <rect width="1600" height="900" fill="#ff9a4a" opacity="0.06"/>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
