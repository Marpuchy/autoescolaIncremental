<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- La Vall d'Alba: camps en mosaic, ametlers florits, una masia, marges de pedra en sec i el Penyagolosa al fons -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eb3e8"/>
      <stop offset="0.45" stop-color="#a6d8f3"/>
      <stop offset="0.6" stop-color="#f0f9fd"/>
    </linearGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f9fd" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0f9fd" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="penya" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#97a2c2"/>
      <stop offset="1" stop-color="#7b86a8"/>
    </linearGradient>
    <pattern id="solcs" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#bf9160"/>
      <rect y="12" width="40" height="4" fill="#a3764a"/>
      <rect y="10" width="40" height="2" fill="#d4a674"/>
    </pattern>
    <pattern id="blat" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e6ca66"/>
      <path d="M3 14 L5 4 M9 14 L11 5" stroke="#cfae48" stroke-width="1.6"/>
    </pattern>
    <pattern id="marge" width="50" height="26" patternUnits="userSpaceOnUse">
      <rect width="50" height="26" fill="#857c6d"/>
      <ellipse cx="12" cy="7" rx="11" ry="6" fill="#bdb3a2"/><ellipse cx="37" cy="8" rx="12" ry="6" fill="#b3a998"/>
      <ellipse cx="24" cy="20" rx="12" ry="6" fill="#c2b8a7"/><ellipse cx="0" cy="20" rx="10" ry="6" fill="#b3a998"/>
      <ellipse cx="50" cy="20" rx="10" ry="6" fill="#b3a998"/>
      <ellipse cx="10" cy="5" rx="6" ry="2" fill="#d6cdbd"/><ellipse cx="22" cy="17" rx="6" ry="2" fill="#d6cdbd"/><ellipse cx="36" cy="5" rx="6" ry="2" fill="#d0c7b7"/>
    </pattern>
    <pattern id="teules" width="14" height="9" patternUnits="userSpaceOnUse">
      <rect width="14" height="9" fill="#b25a38"/>
      <path d="M0 9 Q7 2 14 9" fill="#9c4b2d"/>
    </pattern>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#686c70"/>
      <stop offset="1" stop-color="#505357"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.12"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.1"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
      <circle cx="12" cy="31" r="1" fill="#000" opacity="0.2"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#14200c" stop-opacity="0.34"/>
    </radialGradient>
    <symbol id="ametler" viewBox="0 0 120 126">
      <ellipse cx="64" cy="121" rx="42" ry="5" fill="#4a5a2a" opacity="0.3"/>
      <path d="M58 120 L60 70 Q46 56 30 52 M60 70 Q72 54 92 48 M60 80 Q60 60 62 40" stroke="#5c4030" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g fill="#f6cfdb">
        <circle cx="30" cy="50" r="20"/><circle cx="60" cy="36" r="24"/><circle cx="92" cy="48" r="20"/>
        <circle cx="44" cy="32" r="16"/><circle cx="78" cy="30" r="16"/>
      </g>
      <g fill="#fdeef2">
        <circle cx="26" cy="44" r="12"/><circle cx="54" cy="28" r="15"/><circle cx="86" cy="42" r="12"/><circle cx="40" cy="26" r="9"/><circle cx="74" cy="24" r="9"/>
      </g>
      <g fill="#e98fab"><circle cx="36" cy="50" r="3"/><circle cx="62" cy="40" r="3"/><circle cx="90" cy="52" r="3"/><circle cx="70" cy="46" r="2.5"/><circle cx="46" cy="38" r="2.5"/><circle cx="80" cy="34" r="2"/></g>
      <g fill="#8a5a44"><circle cx="30" cy="60" r="1.6"/><circle cx="96" cy="58" r="1.6"/></g>
    </symbol>
    <symbol id="olivera" viewBox="0 0 40 30">
      <rect x="18" y="16" width="4" height="14" fill="#6b5440"/>
      <ellipse cx="20" cy="14" rx="18" ry="12" fill="#7c9360"/>
      <ellipse cx="16" cy="10" rx="9" ry="6" fill="#93aa74"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="240" cy="130" r="150" fill="url(#sol)"/>
  <circle cx="240" cy="130" r="40" fill="#fffbe9"/>
  <g>
    <g fill="#d6e8f2"><ellipse cx="450" cy="142" rx="140" ry="20"/><ellipse cx="1190" cy="170" rx="110" ry="16"/></g>
    <g fill="#fff">
      <ellipse cx="390" cy="128" rx="60" ry="24"/><ellipse cx="460" cy="108" rx="70" ry="38"/><ellipse cx="530" cy="130" rx="50" ry="20"/>
      <ellipse cx="1150" cy="158" rx="50" ry="18"/><ellipse cx="1210" cy="146" rx="56" ry="26"/>
    </g>
  </g>

  <!-- Penyagolosa -->
  <path d="M640 440 L860 250 L905 190 L930 205 L960 170 L1010 240 L1150 360 L1360 440 Z" fill="url(#penya)"/>
  <path d="M960 170 L1010 240 L1150 360 L1360 440 L1040 440 L990 300 Z" fill="#6d789b" opacity="0.7"/>
  <path d="M905 190 L930 205 L960 170 L990 214 L975 236 L950 222 L930 240 L914 222 L880 236 Z" fill="#f4f6fb"/>
  <path d="M960 170 L990 214 L975 236 L962 210 Z" fill="#cdd4e6"/>
  <g stroke="#6d789b" stroke-width="3" opacity="0.5" fill="none"><path d="M880 280 L850 340 M930 260 L920 330 M1000 280 L1030 350"/></g>
  <rect y="300" width="1600" height="160" fill="url(#boira)"/>
  <!-- turons amb oliveres -->
  <path d="M0 470 L200 390 L420 436 L620 386 L800 432 L1000 394 L1260 444 L1440 394 L1600 424 V700 H0 Z" fill="#a9ba98"/>
  <g>
    <use href="#olivera" x="160" y="420" width="26" height="20"/><use href="#olivera" x="220" y="414" width="24" height="18"/>
    <use href="#olivera" x="560" y="410" width="24" height="18"/><use href="#olivera" x="620" y="404" width="26" height="20"/>
    <use href="#olivera" x="1380" y="414" width="26" height="20"/><use href="#olivera" x="1450" y="410" width="24" height="18"/>
    <use href="#olivera" x="980" y="418" width="24" height="18"/>
  </g>
  <rect y="400" width="1600" height="110" fill="url(#boira)" opacity="0.5"/>

  <!-- camps en mosaic -->
  <path d="M0 520 Q400 470 800 510 T1600 500 V900 H0 Z" fill="#8fb45a"/>
  <path d="M0 560 L520 530 L600 620 L0 650 Z" fill="url(#blat)"/>
  <path d="M520 530 L1040 540 L1060 630 L600 620 Z" fill="url(#solcs)"/>
  <path d="M1040 540 L1600 530 V630 L1060 630 Z" fill="#9cc466"/>
  <g stroke="#88b04f" stroke-width="3" opacity="0.7"><path d="M1080 560 H1600 M1070 590 H1600 M1066 616 H1600"/></g>
  <path d="M0 650 L600 620 L1060 630 L1600 630 V740 H0 Z" fill="#b8cf73"/>
  <!-- fileres de separació entre camps -->
  <g stroke="#7c9a4a" stroke-width="4" fill="none" opacity="0.6"><path d="M0 650 L600 620 L1060 630 L1600 630"/><path d="M520 530 L600 620"/><path d="M1040 540 L1060 630"/></g>
  <g fill="#6f8f42"><circle cx="560" cy="580" r="7"/><circle cx="1050" cy="586" r="7"/><circle cx="300" cy="640" r="6"/></g>

  <!-- masia -->
  <g>
    <ellipse cx="1300" cy="552" rx="170" ry="8" fill="#5a6e30" opacity="0.35"/>
    <rect x="1160" y="440" width="200" height="110" fill="#e0cfad"/>
    <rect x="1360" y="470" width="90" height="80" fill="#cdb995"/>
    <rect x="1330" y="440" width="30" height="110" fill="#cbb792"/>
    <polygon points="1150,444 1260,396 1370,444" fill="url(#teules)"/>
    <polygon points="1260,396 1370,444 1330,444" fill="#000" opacity="0.15"/>
    <polygon points="1356,474 1405,450 1456,474" fill="url(#teules)"/>
    <rect x="1150" y="442" width="220" height="5" fill="#8a4128"/>
    <path d="M1232 550 V506 Q1258 480 1284 506 V550 Z" fill="#c4ae88"/>
    <path d="M1240 550 V510 Q1258 492 1276 510 V550 Z" fill="#6b4a2f"/>
    <g fill="#4a5e70"><rect x="1190" y="470" width="24" height="22"/><rect x="1300" y="470" width="24" height="22"/><rect x="1392" y="492" width="18" height="18"/></g>
    <g fill="#6b4a2f"><rect x="1186" y="468" width="32" height="4"/><rect x="1296" y="468" width="32" height="4"/></g>
    <rect x="1290" y="400" width="18" height="30" fill="#b8a582"/>
    <rect x="1287" y="398" width="24" height="5" fill="#9a8766"/>
    <g fill="#e8eef2" opacity="0.8"><ellipse cx="1302" cy="382" rx="10" ry="7"/><ellipse cx="1314" cy="364" rx="14" ry="9"/><ellipse cx="1330" cy="342" rx="18" ry="10"/></g>
    <!-- era i garrofer -->
    <ellipse cx="1110" cy="548" rx="40" ry="6" fill="#d8c8a0"/>
    <ellipse cx="1080" cy="520" rx="36" ry="26" fill="#3f6a34"/><ellipse cx="1070" cy="512" rx="18" ry="12" fill="#4f7d42"/>
    <rect x="1077" y="530" width="6" height="20" fill="#5c4030"/>
  </g>
  <!-- xiprers -->
  <ellipse cx="1480" cy="480" rx="18" ry="70" fill="#2a5230"/>
  <ellipse cx="1474" cy="470" rx="8" ry="56" fill="#3a6a3c"/>
  <ellipse cx="1512" cy="500" rx="13" ry="50" fill="#2a5230"/>

  <!-- ametlers -->
  <use href="#ametler" x="80" y="534" width="150" height="158"/>
  <use href="#ametler" x="300" y="556" width="120" height="126"/>
  <use href="#ametler" x="700" y="554" width="130" height="137"/>
  <use href="#ametler" x="960" y="556" width="120" height="126"/>
  <use href="#ametler" x="1380" y="554" width="150" height="158"/>
  <!-- pètals que cauen -->
  <g fill="#f6cfdb"><circle cx="250" cy="620" r="3"/><circle cx="270" cy="660" r="2.5"/><circle cx="850" cy="640" r="3"/><circle cx="880" cy="600" r="2.5"/><circle cx="1350" cy="640" r="3"/><circle cx="440" cy="650" r="2.5"/></g>
  <!-- flors silvestres -->
  <g fill="#e2332b"><circle cx="520" cy="690" r="5"/><circle cx="540" cy="700" r="4"/><circle cx="1150" cy="684" r="5"/><circle cx="1180" cy="694" r="4"/><circle cx="640" cy="696" r="4"/></g>
  <g fill="#f5f0dc"><circle cx="600" cy="684" r="3"/><circle cx="1210" cy="690" r="3"/><circle cx="1260" cy="700" r="3"/><circle cx="40" cy="700" r="3"/></g>

  <!-- marge de pedra en sec -->
  <rect y="700" width="1600" height="40" fill="url(#marge)"/>
  <rect y="698" width="1600" height="5" fill="#6f8f42"/>
  <rect y="736" width="1600" height="4" fill="#000" opacity="0.2"/>
  <g fill="#6f9a44">
    <path d="M200 702 q5 -16 9 0 q4 -12 8 0 z"/><path d="M660 702 q5 -16 9 0 q4 -12 8 0 z"/><path d="M1040 702 q5 -16 9 0 q4 -12 8 0 z"/><path d="M1540 702 q5 -16 9 0 q4 -12 8 0 z"/>
  </g>

  <!-- camí rural asfaltat -->
  <rect y="740" width="1600" height="160" fill="url(#asfalt)"/>
  <rect y="740" width="1600" height="160" fill="url(#gra)"/>
  <rect y="740" width="1600" height="6" fill="#cfc6ad"/>
  <rect y="746" width="1600" height="6" fill="#000" opacity="0.16"/>
  <g fill="#5b5e62" opacity="0.8"><rect x="300" y="780" width="120" height="30" rx="4"/><rect x="1100" y="850" width="160" height="26" rx="4"/></g>
  <line x1="0" y1="822" x2="1600" y2="822" stroke="#f3f1e6" stroke-width="7" stroke-dasharray="70 55" opacity="0.9"/>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
