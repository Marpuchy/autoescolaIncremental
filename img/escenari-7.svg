<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- La Vall d'Alba: camps, ametlers florits, una masia, marges de pedra en sec i el Penyagolosa al fons -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccbf0"/>
      <stop offset="1" stop-color="#eef8fd"/>
    </linearGradient>
    <pattern id="solcs" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#b98a5a"/>
      <rect y="12" width="40" height="4" fill="#a3764a"/>
    </pattern>
    <pattern id="marge" width="50" height="26" patternUnits="userSpaceOnUse">
      <rect width="50" height="26" fill="#a39a8a"/>
      <ellipse cx="12" cy="7" rx="11" ry="6" fill="#bdb3a2"/><ellipse cx="37" cy="8" rx="12" ry="6" fill="#b3a998"/>
      <ellipse cx="24" cy="20" rx="12" ry="6" fill="#c2b8a7"/><ellipse cx="0" cy="20" rx="10" ry="6" fill="#b3a998"/>
      <ellipse cx="50" cy="20" rx="10" ry="6" fill="#b3a998"/>
    </pattern>
    <symbol id="ametler" viewBox="0 0 120 120">
      <path d="M58 120 L60 70 Q46 56 30 52 M60 70 Q72 54 92 48 M60 80 Q60 60 62 40" stroke="#5c4030" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g fill="#fbe3ea">
        <circle cx="30" cy="48" r="20"/><circle cx="60" cy="34" r="24"/><circle cx="92" cy="46" r="20"/>
        <circle cx="44" cy="30" r="16"/><circle cx="78" cy="28" r="16"/>
      </g>
      <g fill="#f4b6c8"><circle cx="36" cy="44" r="4"/><circle cx="58" cy="26" r="4"/><circle cx="86" cy="40" r="4"/><circle cx="70" cy="44" r="3"/><circle cx="46" cy="36" r="3"/></g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="420" cy="130" rx="110" ry="28"/><ellipse cx="490" cy="112" rx="60" ry="28"/>
    <ellipse cx="1180" cy="160" rx="90" ry="22"/>
  </g>

  <!-- Penyagolosa -->
  <path d="M700 420 L860 250 L905 190 L930 205 L960 170 L1010 240 L1150 360 L1300 420 Z" fill="#8a95b5"/>
  <path d="M905 190 L930 205 L960 170 L990 214 L960 230 L930 222 Z" fill="#eef1f7"/>
  <path d="M0 460 L200 380 L420 430 L620 380 L800 430 L1000 390 L1260 440 L1440 390 L1600 420 V900 H0 Z" fill="#a8b89a"/>

  <!-- camps en mosaic -->
  <path d="M0 520 Q400 470 800 510 T1600 500 V900 H0 Z" fill="#8fb45a"/>
  <path d="M0 560 L520 530 L600 620 L0 650 Z" fill="#e4c865"/>
  <path d="M520 530 L1040 540 L1060 630 L600 620 Z" fill="url(#solcs)"/>
  <path d="M1040 540 L1600 530 V630 L1060 630 Z" fill="#9cc466"/>
  <path d="M0 650 L600 620 L1060 630 L1600 630 V740 H0 Z" fill="#b8cf73"/>

  <!-- masia -->
  <g>
    <rect x="1160" y="440" width="200" height="110" fill="#d8c6a4"/>
    <rect x="1360" y="470" width="90" height="80" fill="#cdb995"/>
    <polygon points="1150,444 1260,396 1370,444" fill="#b25a38"/>
    <polygon points="1356,474 1405,450 1456,474" fill="#a8532f"/>
    <rect x="1240" y="490" width="36" height="60" fill="#6b4a2f"/>
    <rect x="1190" y="470" width="24" height="22" fill="#4a5e70"/><rect x="1300" y="470" width="24" height="22" fill="#4a5e70"/>
    <rect x="1290" y="400" width="18" height="30" fill="#b8a582"/>
  </g>
  <!-- xiprer -->
  <ellipse cx="1480" cy="480" rx="18" ry="70" fill="#2f5a34"/>

  <!-- ametlers -->
  <use href="#ametler" x="80" y="540" width="150" height="150"/>
  <use href="#ametler" x="300" y="560" width="120" height="120"/>
  <use href="#ametler" x="700" y="560" width="130" height="130"/>
  <use href="#ametler" x="960" y="560" width="120" height="120"/>
  <use href="#ametler" x="1380" y="560" width="150" height="150"/>

  <!-- marge de pedra en sec -->
  <rect y="700" width="1600" height="40" fill="url(#marge)"/>

  <!-- camí rural asfaltat -->
  <rect y="740" width="1600" height="160" fill="#62666a"/>
  <rect y="740" width="1600" height="6" fill="#cfc6ad"/>
  <line x1="0" y1="822" x2="1600" y2="822" stroke="#f3f3f3" stroke-width="7" stroke-dasharray="70 55"/>
</svg>
