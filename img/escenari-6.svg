<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Carreronets de Sogorb: carrerons empedrats, balcons amb flors, l'aqüeducte, la catedral i el castell al fons -->
  <defs>
