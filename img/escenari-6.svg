      <stop offset="0" stop-color="#4f9fd8"/>
      <stop offset="0.6" stop-color="#9fd0ee"/>
      <stop offset="0.85" stop-color="#e2f2fa"/>
    </linearGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
