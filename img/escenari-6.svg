      <stop offset="1" stop-color="#e2f2fa" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="llambordes" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#6e6256"/>
      <rect x="2" y="2" width="26" height="12" rx="5" fill="#9a8b7b"/>
      <rect x="32" y="2" width="26" height="12" rx="5" fill="#a39584"/>
      <rect x="-13" y="17" width="26" height="12" rx="5" fill="#958674"/>
      <rect x="17" y="17" width="26" height="12" rx="5" fill="#a8998a"/>
      <rect x="47" y="17" width="26" height="12" rx="5" fill="#958674"/>
      <rect x="4" y="3" width="18" height="3" rx="1.5" fill="#b8aa99"/><rect x="34" y="3" width="18" height="3" rx="1.5" fill="#bcae9d"/>
