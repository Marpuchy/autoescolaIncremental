<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Bous a Vila-real: carrer de poble amb cadafals de fusta i gent dalt, campanar, banderoles, terra amb arena i la gàbia del bou -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fc8"/>
      <stop offset="0.6" stop-color="#f0a86a"/>
      <stop offset="0.85" stop-color="#ffd8a0"/>
    </linearGradient>
    <pattern id="teules" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#b9603f"/>
      <path d="M0 10 Q8 2 16 10" fill="#a44f31"/>
    </pattern>
    <pattern id="fusta" width="40" height="30" patternUnits="userSpaceOnUse">
      <rect width="40" height="30" fill="#8a5a33"/>
      <rect y="0" width="40" height="13" fill="#9a6a3f"/><rect y="15" width="40" height="13" fill="#7d5130"/>
      <path d="M6 6 H18 M24 21 H36" stroke="#6b4426" stroke-width="1.5"/>
    </pattern>
    <pattern id="arena" width="48" height="36" patternUnits="userSpaceOnUse">
      <rect width="48" height="36" fill="#c9a26e"/>
      <circle cx="6" cy="8" r="1.8" fill="#e0c08a"/><circle cx="30" cy="4" r="1.4" fill="#a8844f"/>
      <circle cx="20" cy="22" r="1.6" fill="#e0c08a"/><circle cx="42" cy="28" r="2" fill="#a8844f"/>
      <circle cx="12" cy="31" r="1.2" fill="#a8844f"/>
    </pattern>
    <linearGradient id="ombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#3a2410" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1608" stop-opacity="0.4"/>
    </radialGradient>
    <symbol id="persona" viewBox="0 0 40 70">
      <circle cx="20" cy="12" r="10"/>
      <path d="M4 70 Q4 26 20 26 Q36 26 36 70 Z"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7"><ellipse cx="420" cy="110" rx="90" ry="16"/><ellipse cx="1200" cy="80" rx="70" ry="14"/></g>

  <!-- campanar de l'església al fons -->
  <rect x="740" y="140" width="110" height="420" fill="#e2c99c"/>
  <rect x="812" y="140" width="38" height="420" fill="#c9ad80"/>
  <rect x="732" y="230" width="126" height="10" fill="#c9ad80"/><rect x="732" y="380" width="126" height="10" fill="#c9ad80"/>
  <path d="M760 220 V178 Q772 162 784 178 V220 Z M806 220 V178 Q818 162 830 178 V220 Z" fill="#4a3a2a"/>
  <circle cx="795" cy="310" r="26" fill="#f4ecd8"/><circle cx="795" cy="310" r="26" fill="none" stroke="#8a6a40" stroke-width="4"/>
  <path d="M795 310 V292 M795 310 H808" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M730 142 Q795 70 860 142 Z" fill="url(#teules)"/>
  <rect x="793" y="54" width="4" height="30" fill="#4a3a2a"/><rect x="785" y="62" width="20" height="3" fill="#4a3a2a"/>

  <!-- cases del fons -->
  <g fill="#f3e6cc"><rect x="420" y="380" width="320" height="260"/><rect x="850" y="360" width="330" height="280"/></g>
  <g fill="url(#teules)"><rect x="410" y="366" width="340" height="18"/><rect x="840" y="346" width="350" height="18"/></g>
  <g fill="#4f6474"><rect x="460" y="420" width="40" height="60"/><rect x="560" y="420" width="40" height="60"/><rect x="660" y="420" width="40" height="60"/>
    <rect x="900" y="400" width="40" height="60"/><rect x="1000" y="400" width="40" height="60"/><rect x="1100" y="400" width="40" height="60"/></g>
  <!-- banderoles de colors creuant el carrer -->
  <path d="M420 300 Q800 380 1180 290" stroke="#555" stroke-width="2" fill="none"/>
  <g>
    <polygon points="460,309 480,313 468,334" fill="#e23b2e"/><polygon points="520,322 540,326 528,347" fill="#f2c200"/>
    <polygon points="580,333 600,336 588,357" fill="#3fb06a"/><polygon points="640,341 660,344 648,365" fill="#3a8ae0"/>
    <polygon points="700,346 720,348 708,369" fill="#e23b2e"/><polygon points="760,349 780,349 770,370" fill="#f2c200"/>
    <polygon points="820,349 840,348 832,369" fill="#3fb06a"/><polygon points="880,346 900,344 892,365" fill="#3a8ae0"/>
    <polygon points="940,339 960,336 954,357" fill="#e23b2e"/><polygon points="1000,329 1020,325 1014,346" fill="#f2c200"/>
    <polygon points="1060,317 1080,312 1074,333" fill="#3fb06a"/><polygon points="1120,303 1140,298 1134,319" fill="#3a8ae0"/>
  </g>

  <!-- façanes dels costats -->
  <rect x="0" y="60" width="380" height="660" fill="#efe0c4"/>
  <rect x="1220" y="40" width="380" height="680" fill="#f4e8d0"/>
  <rect x="0" y="46" width="394" height="20" fill="url(#teules)"/><rect x="1206" y="26" width="394" height="20" fill="url(#teules)"/>
  <g fill="#4f6474"><rect x="80" y="130" width="60" height="90"/><rect x="230" y="130" width="60" height="90"/><rect x="1310" y="110" width="60" height="90"/><rect x="1460" y="110" width="60" height="90"/></g>
  <g fill="#2e2e2e"><rect x="70" y="214" width="80" height="6"/><rect x="220" y="214" width="80" height="6"/><rect x="1300" y="194" width="80" height="6"/><rect x="1450" y="194" width="80" height="6"/></g>
  <!-- mocadors penjats dels balcons -->
  <g><rect x="94" y="220" width="32" height="40" fill="#e23b2e"/><rect x="244" y="220" width="32" height="40" fill="#f2c200"/><rect x="1324" y="200" width="32" height="40" fill="#f2c200"/><rect x="1474" y="200" width="32" height="40" fill="#e23b2e"/></g>

  <!-- cadafal esquerre: bigues de fusta amb gent dalt -->
  <g>
    <g fill="#5b3a20">
      <rect x="0" y="420" width="16" height="290"/><rect x="120" y="420" width="16" height="290"/><rect x="240" y="420" width="16" height="290"/><rect x="360" y="420" width="16" height="290"/>
    </g>
    <rect x="-10" y="430" width="400" height="34" fill="url(#fusta)"/>
    <rect x="-10" y="462" width="400" height="6" fill="#000" opacity="0.25"/>
    <g fill="url(#fusta)"><rect x="-10" y="560" width="400" height="22"/><rect x="-10" y="640" width="400" height="22"/></g>
    <g stroke="#5b3a20" stroke-width="10"><path d="M16 468 L120 560 M136 468 L240 560 M256 468 L360 560"/></g>
    <g fill="#3a2a40">
      <use href="#persona" x="20" y="366" width="40" height="70"/><use href="#persona" x="80" y="372" width="36" height="64" fill="#2a3a50"/>
      <use href="#persona" x="150" y="364" width="40" height="70" fill="#5a2a2a"/><use href="#persona" x="220" y="370" width="38" height="66"/>
      <use href="#persona" x="290" y="364" width="40" height="70" fill="#2a4a3a"/>
    </g>
  </g>
  <!-- cadafal dret -->
  <g>
    <g fill="#5b3a20">
      <rect x="1224" y="420" width="16" height="290"/><rect x="1344" y="420" width="16" height="290"/><rect x="1464" y="420" width="16" height="290"/><rect x="1584" y="420" width="16" height="290"/>
    </g>
    <rect x="1210" y="430" width="400" height="34" fill="url(#fusta)"/>
    <rect x="1210" y="462" width="400" height="6" fill="#000" opacity="0.25"/>
    <g fill="url(#fusta)"><rect x="1210" y="560" width="400" height="22"/><rect x="1210" y="640" width="400" height="22"/></g>
    <g stroke="#5b3a20" stroke-width="10"><path d="M1240 560 L1344 468 M1360 560 L1464 468 M1480 560 L1584 468"/></g>
    <g fill="#3a2a40">
      <use href="#persona" x="1250" y="364" width="40" height="70" fill="#5a2a2a"/><use href="#persona" x="1320" y="370" width="38" height="66"/>
      <use href="#persona" x="1390" y="364" width="40" height="70" fill="#2a3a50"/><use href="#persona" x="1460" y="372" width="36" height="64" fill="#2a4a3a"/>
      <use href="#persona" x="1530" y="366" width="40" height="70"/>
    </g>
    <!-- algú que encara puja corrent -->
    <use href="#persona" x="1196" y="560" width="40" height="70" fill="#e2683a"/>
  </g>

  <!-- gàbia del bou al fons del carrer -->
  <g>
    <rect x="690" y="560" width="220" height="130" fill="#6b4426"/>
    <rect x="700" y="570" width="200" height="110" fill="url(#fusta)"/>
    <g stroke="#3a2410" stroke-width="6"><line x1="740" y1="570" x2="740" y2="680"/><line x1="780" y1="570" x2="780" y2="680"/><line x1="820" y1="570" x2="820" y2="680"/><line x1="860" y1="570" x2="860" y2="680"/></g>
    <rect x="680" y="552" width="240" height="14" fill="#4a2e18"/>
  </g>
  <!-- bala de palla -->
  <g><rect x="440" y="640" width="120" height="60" rx="8" fill="#e2c060"/><g stroke="#c9a540" stroke-width="3"><path d="M450 656 H550 M450 672 H550 M450 688 H550"/></g>
    <rect x="1060" y="646" width="110" height="54" rx="8" fill="#e2c060"/><g stroke="#c9a540" stroke-width="3"><path d="M1070 662 H1160 M1070 678 H1160"/></g></g>

  <!-- terra amb arena -->
  <rect y="700" width="1600" height="200" fill="url(#arena)"/>
  <rect y="700" width="1600" height="200" fill="url(#ombra)"/>
  <rect y="700" width="1600" height="6" fill="#a8844f"/>
  <!-- petjades de bou -->
  <g fill="#9a7644" opacity="0.7">
    <ellipse cx="300" cy="790" rx="8" ry="5"/><ellipse cx="316" cy="790" rx="8" ry="5"/>
    <ellipse cx="520" cy="830" rx="8" ry="5"/><ellipse cx="536" cy="830" rx="8" ry="5"/>
    <ellipse cx="1100" cy="780" rx="8" ry="5"/><ellipse cx="1116" cy="780" rx="8" ry="5"/>
    <ellipse cx="1320" cy="840" rx="8" ry="5"/><ellipse cx="1336" cy="840" rx="8" ry="5"/>
  </g>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
