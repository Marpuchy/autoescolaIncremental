<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- La Vall d'Uixó: les Coves de Sant Josep, el riu subterrani que en ix, tarongers i palmeres -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa6de"/>
      <stop offset="0.5" stop-color="#94cdee"/>
      <stop offset="0.72" stop-color="#e6f5fb"/>
    </linearGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f5fb" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6f5fb" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="roca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7ab86"/>
      <stop offset="0.55" stop-color="#b89c78"/>
      <stop offset="1" stop-color="#977d5e"/>
    </linearGradient>
    <radialGradient id="cova" cx="0.5" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="0.5" stop-color="#150f0b"/>
      <stop offset="1" stop-color="#0b0806"/>
    </radialGradient>
    <radialGradient id="fanalet">
      <stop offset="0" stop-color="#ffc766" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="riu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f80"/>
      <stop offset="0.4" stop-color="#2f8fb5"/>
      <stop offset="1" stop-color="#6fd0e6"/>
    </linearGradient>
    <linearGradient id="camp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc462"/>
      <stop offset="1" stop-color="#7aa44a"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6166"/>
      <stop offset="1" stop-color="#46494e"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.12"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.1"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
      <circle cx="12" cy="31" r="1" fill="#000" opacity="0.2"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1a14" stop-opacity="0.38"/>
    </radialGradient>
    <symbol id="taronger" viewBox="0 0 100 106">
      <ellipse cx="54" cy="101" rx="36" ry="5" fill="#2e4a1a" opacity="0.35"/>
      <rect x="45" y="62" width="10" height="40" fill="#5e3f26"/>
      <circle cx="50" cy="44" r="38" fill="#285e2e"/>
      <circle cx="42" cy="36" r="26" fill="#347538"/>
      <circle cx="36" cy="28" r="12" fill="#4a8d45"/>
      <g fill="#f5901f"><circle cx="30" cy="48" r="6"/><circle cx="58" cy="30" r="6"/><circle cx="68" cy="54" r="6"/><circle cx="46" cy="64" r="5"/><circle cx="46" cy="18" r="5"/></g>
      <g fill="#ffd08a"><circle cx="28" cy="46" r="2"/><circle cx="56" cy="28" r="2"/></g>
    </symbol>
    <symbol id="palmera" viewBox="0 0 120 260">
      <path d="M58 260 Q54 160 62 60" stroke="#7a5a3a" stroke-width="12" fill="none"/>
      <path d="M56 250 Q52 160 60 70" stroke="#9a7852" stroke-width="4" fill="none" stroke-dasharray="6 8"/>
      <g fill="#2f7a32">
        <path d="M62 60 Q20 40 0 70 Q30 52 62 64Z"/><path d="M62 60 Q100 36 120 66 Q92 50 62 64Z"/>
        <path d="M62 58 Q40 10 12 20 Q44 24 60 62Z"/><path d="M62 58 Q86 8 112 22 Q80 26 64 62Z"/>
      </g>
      <g fill="#4a9a3f"><path d="M62 56 Q62 20 64 0 Q70 30 64 60Z"/><path d="M62 60 Q34 30 20 36 Q44 40 62 62Z"/></g>
      <g fill="#c98a2e"><circle cx="58" cy="66" r="4"/><circle cx="66" cy="68" r="4"/><circle cx="62" cy="72" r="4"/></g>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g>
    <g fill="#d4e6f1"><ellipse cx="310" cy="134" rx="130" ry="20"/><ellipse cx="1250" cy="100" rx="100" ry="16"/></g>
    <g fill="#fff">
      <ellipse cx="250" cy="120" rx="56" ry="24"/><ellipse cx="320" cy="102" rx="64" ry="36"/><ellipse cx="384" cy="122" rx="48" ry="20"/>
      <ellipse cx="1210" cy="88" rx="50" ry="20"/><ellipse cx="1270" cy="78" rx="54" ry="26"/>
    </g>
  </g>

  <!-- serra del fons -->
  <path d="M0 430 L200 334 L380 400 L560 304 L760 380 L1000 284 L1220 372 L1420 302 L1600 360 V640 H0 Z" fill="#a4bcae"/>
  <g fill="#98b2a5">
    <polygon points="200,334 380,400 320,640 210,640"/><polygon points="560,304 760,380 700,640 570,640"/>
    <polygon points="1000,284 1220,372 1140,640 1010,640"/><polygon points="1420,302 1600,360 1600,640 1430,640"/>
  </g>
  <rect y="340" width="1600" height="300" fill="url(#boira)"/>

  <!-- la muntanya calcària de la cova -->
  <path d="M360 710 Q400 470 620 376 Q760 318 900 356 Q1080 400 1190 520 Q1250 600 1280 710 Z" fill="url(#roca)"/>
  <path d="M620 376 Q760 318 900 356 Q820 378 760 420 Q680 462 636 524 Q600 460 620 376 Z" fill="#d6bf9c"/>
  <path d="M1000 380 Q1100 430 1190 520 Q1250 600 1280 710 L1140 710 Q1150 600 1080 500 Q1040 440 1000 380 Z" fill="#8c7356" opacity="0.6"/>
  <!-- estrats de la roca -->
  <g stroke="#9c8263" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M470 560 Q540 520 610 542"/><path d="M430 630 Q520 600 600 616"/><path d="M1020 470 Q1080 494 1130 556"/>
    <path d="M880 420 Q940 430 986 472"/><path d="M1060 600 Q1120 610 1170 650"/><path d="M660 470 Q700 450 740 456"/>
  </g>
  <!-- vegetació de la muntanya -->
  <g fill="#557f43">
    <circle cx="560" cy="472" r="22"/><circle cx="596" cy="456" r="16"/><circle cx="1100" cy="500" r="20"/>
    <circle cx="1142" cy="540" r="16"/><circle cx="700" cy="404" r="14"/><circle cx="960" cy="380" r="12"/><circle cx="470" cy="600" r="18"/>
  </g>
  <g fill="#6d9a54"><circle cx="554" cy="466" r="12"/><circle cx="1094" cy="494" r="11"/><circle cx="696" cy="400" r="7"/><circle cx="466" cy="594" r="9"/></g>

  <!-- boca de la cova, amb fanalets dins -->
  <path d="M686 712 Q684 556 800 522 Q914 556 924 712 Z" fill="#6f5a44"/>
  <path d="M704 712 Q704 572 800 540 Q896 572 904 712 Z" fill="url(#cova)"/>
  <circle cx="780" cy="640" r="40" fill="url(#fanalet)" opacity="0.6"/>
  <circle cx="780" cy="640" r="4" fill="#ffe2a0"/>
  <circle cx="842" cy="620" r="26" fill="url(#fanalet)" opacity="0.4"/>
  <circle cx="842" cy="620" r="3" fill="#ffe2a0"/>
  <g fill="#6f5a44"><polygon points="740,560 750,594 760,566"/><polygon points="820,548 828,586 838,556"/><polygon points="864,574 870,600 878,582"/></g>

  <!-- rètol -->
  <rect x="934" y="604" width="8" height="106" fill="#5c3a1e"/>
  <rect x="1064" y="604" width="8" height="106" fill="#5c3a1e"/>
  <rect x="890" y="588" width="224" height="48" rx="5" fill="#5c3a1e"/>
  <rect x="894" y="592" width="216" height="40" rx="3" fill="#8a5a33"/>
  <rect x="894" y="592" width="216" height="6" rx="3" fill="#a3703f"/>
  <text x="1002" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#fdf0d5">COVES DE SANT JOSEP</text>

  <!-- el riu que ix de la cova -->
  <rect x="540" y="700" width="580" height="62" fill="#7f9f4f"/>
  <path d="M726 710 Q800 696 884 710 L1010 762 L552 762 Z" fill="url(#riu)"/>
  <g stroke="#d8f4fb" stroke-width="3" opacity="0.85" stroke-linecap="round">
    <line x1="700" y1="730" x2="760" y2="730"/><line x1="820" y1="744" x2="900" y2="744"/><line x1="640" y1="752" x2="690" y2="752"/>
    <line x1="920" y1="752" x2="960" y2="752"/><line x1="780" y1="722" x2="810" y2="722"/>
  </g>
  <!-- barqueta amb barquer -->
  <ellipse cx="812" cy="734" rx="46" ry="5" fill="#1b4d66" opacity="0.5"/>
  <path d="M766 716 L858 716 L844 734 L780 734 Z" fill="#c9793a"/>
  <path d="M766 716 L858 716 L855 721 L769 721 Z" fill="#e39a55"/>
  <rect x="808" y="690" width="10" height="26" rx="3" fill="#2f4a6b"/>
  <circle cx="813" cy="684" r="7" fill="#f0c7a0"/>
  <line x1="826" y1="672" x2="846" y2="740" stroke="#5c3a1e" stroke-width="3"/>

  <!-- camps amb tarongers i palmeres -->
  <path d="M0 640 Q300 610 552 650 L552 762 H0 Z" fill="url(#camp)"/>
  <path d="M1010 762 L1270 650 Q1450 620 1600 640 V762 Z" fill="url(#camp)"/>
  <g fill="#b8d47a" opacity="0.6"><ellipse cx="120" cy="730" rx="60" ry="6"/><ellipse cx="1400" cy="720" rx="80" ry="6"/></g>
  <use href="#palmera" x="440" y="470" width="110" height="240"/>
  <use href="#palmera" x="1180" y="480" width="100" height="230"/>
  <use href="#taronger" x="40" y="600" width="120" height="127"/><use href="#taronger" x="180" y="614" width="110" height="116"/>
  <use href="#taronger" x="320" y="626" width="100" height="106"/><use href="#taronger" x="1300" y="612" width="110" height="116"/>
  <use href="#taronger" x="1440" y="600" width="120" height="127"/>
  <!-- pedres a la vora del riu -->
  <g fill="#a39684"><ellipse cx="560" cy="758" rx="18" ry="8"/><ellipse cx="1000" cy="756" rx="16" ry="7"/><ellipse cx="584" cy="760" rx="10" ry="5"/></g>

  <!-- carretera -->
  <rect y="760" width="1600" height="140" fill="url(#asfalt)"/>
  <rect y="760" width="1600" height="140" fill="url(#gra)"/>
  <rect y="760" width="1600" height="7" fill="#d9d2b8"/>
  <rect y="767" width="1600" height="6" fill="#000" opacity="0.18"/>
  <rect y="780" width="1600" height="4" fill="#ecebe4" opacity="0.85"/>
  <line x1="0" y1="836" x2="1600" y2="836" stroke="#f3f1e6" stroke-width="7" stroke-dasharray="70 55" opacity="0.92"/>
  <rect y="888" width="1600" height="4" fill="#ecebe4" opacity="0.85"/>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
