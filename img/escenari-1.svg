    <rect x="1098" y="486" width="62" height="82" fill="#efe6d2"/>
    <rect x="1140" y="486" width="20" height="82" fill="#d8ccb4"/>
    <polygon points="1094,488 1129,466 1164,488" fill="#b85a38"/>
    <polygon points="1129,466 1164,488 1150,488" fill="#9e4a2e"/>
    <path d="M1122 510 Q1129 500 1136 510 V522 H1122 Z" fill="#4e3f33"/>
    <circle cx="1129" cy="478" r="4" fill="#d8ccb4"/>
    <rect x="1074" y="430" width="26" height="138" fill="#f3ead8"/>
    <rect x="1089" y="430" width="11" height="138" fill="#d8ccb4"/>
    <rect x="1071" y="428" width="32" height="6" fill="#d8ccb4"/>
    <path d="M1081 452 Q1087 442 1093 452 V462 H1081 Z" fill="#4e3f33"/>
    <rect x="1071" y="470" width="32" height="4" fill="#d8ccb4"/>
    <polygon points="1072,430 1087,404 1102,430" fill="#c4613e"/>
    <polygon points="1087,404 1102,430 1089,430" fill="#9e4a2e"/>
    <rect x="1086" y="394" width="2" height="12" fill="#4e3f33"/><rect x="1082" y="398" width="10" height="2" fill="#4e3f33"/>
    <!-- replà del turó on s'assenta el poble (tapa la base de l'església i de les cases del fons) -->
    <path d="M940 572 Q960 548 1010 546 Q1100 538 1190 546 Q1240 550 1256 572 Z" fill="#528a45"/>
    <use href="#casa" x="966" y="508" width="62" height="50"/>
    <use href="#casa" x="1022" y="520" width="56" height="45"/>
    <use href="#casa" x="1118" y="510" width="60" height="48"/>
    <use href="#casa" x="1170" y="522" width="50" height="40"/>
    <use href="#casa" x="1064" y="532" width="64" height="51"/>
    <!-- xiprers -->
    <ellipse cx="956" cy="548" rx="7" ry="24" fill="#2b4f27"/><ellipse cx="1228" cy="548" rx="6" ry="20" fill="#2b4f27"/>
  </g>

  <!-- camp -->
  <path d="M0 646 Q400 610 800 636 T1600 628 V760 H0 Z" fill="url(#camp)"/>
  <g fill="#6f9f45">
    <path d="M116 690 Q118 680 115 674 Q121 682 124 672 Q127 682 133 675 Q130 682 132 690 Z"/>
    <path d="M516 676 Q518 666 515 660 Q521 668 524 658 Q527 668 533 661 Q530 668 532 676 Z"/>
    <path d="M956 700 Q958 690 955 684 Q961 692 964 682 Q967 692 973 685 Q970 692 972 700 Z"/>
    <path d="M1176 668 Q1178 658 1175 652 Q1181 660 1184 650 Q1187 660 1193 653 Q1190 660 1192 668 Z"/>
    <path d="M326 720 Q328 710 325 704 Q331 712 334 702 Q337 712 343 705 Q340 712 342 720 Z"/>
  </g>
  <g fill="#f4e7a1"><circle cx="430" cy="702" r="3"/><circle cx="446" cy="708" r="3"/><circle cx="1090" cy="690" r="3"/><circle cx="1270" cy="712" r="3"/></g>

  <!-- sureres -->
  <use href="#surera" x="20" y="470" width="240" height="255"/>
  <use href="#surera" x="1360" y="456" width="250" height="266"/>
  <use href="#surera" x="630" y="566" width="120" height="128"/>
  <use href="#surera" x="1210" y="584" width="104" height="110"/>
  <use href="#mata" x="480" y="690" width="90" height="45"/>
  <use href="#mata" x="1000" y="700" width="70" height="35"/>

  <!-- rètol d'entrada al poble -->
  <g>
    <rect x="287" y="664" width="6" height="80" fill="#8c9196"/>
    <rect x="230" y="626" width="120" height="44" rx="3" fill="#fff" stroke="#d62b25" stroke-width="5"/>
    <text x="290" y="657" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="24" fill="#222">ESLIDA</text>
  </g>

  <!-- voral -->
  <rect y="728" width="1600" height="14" fill="#b9a878"/>
  <g fill="#6b9a44">
    <path d="M40 732 q6 -16 10 0 q4 -14 8 0 z"/><path d="M380 734 q6 -16 10 0 q4 -14 8 0 z"/>
    <path d="M760 732 q6 -16 10 0 q4 -14 8 0 z"/><path d="M1130 734 q6 -16 10 0 q4 -14 8 0 z"/>
    <path d="M1500 732 q6 -16 10 0 q4 -14 8 0 z"/>
  </g>

  <!-- carretera -->
  <rect y="740" width="1600" height="160" fill="url(#asfalt)"/>
  <rect y="740" width="1600" height="160" fill="url(#gra)"/>
  <rect y="740" width="1600" height="7" fill="#cfc7a8"/>
  <rect y="747" width="1600" height="6" fill="#000" opacity="0.18"/>
  <rect y="762" width="1600" height="4" fill="#ecebe4" opacity="0.85"/>
  <line x1="0" y1="826" x2="1600" y2="826" stroke="#f3f1e6" stroke-width="7" stroke-dasharray="70 55" opacity="0.92"/>
  <rect y="884" width="1600" height="4" fill="#ecebe4" opacity="0.85"/>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
