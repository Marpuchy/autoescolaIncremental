<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Afores d'Eslida: Serra d'Espadà, penyals de rodeno roig, sureres i el poble al vessant -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f93dc"/>
      <stop offset="0.5" stop-color="#8cc6ef"/>
      <stop offset="0.72" stop-color="#e3f3fb"/>
    </linearGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.25" stop-color="#fff3b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6fb" stop-opacity="0"/>
      <stop offset="1" stop-color="#eaf6fb" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="camp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93bf5c"/>
      <stop offset="1" stop-color="#6f9d45"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6166"/>
      <stop offset="1" stop-color="#46494e"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.12"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.1"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
      <circle cx="12" cy="31" r="1" fill="#000" opacity="0.2"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1a10" stop-opacity="0.38"/>
    </radialGradient>

    <!-- surera: la part baixa del tronc, pelada, és roja -->
    <symbol id="surera" viewBox="0 0 160 170">
      <ellipse cx="80" cy="164" rx="62" ry="7" fill="#1d3a14" opacity="0.3"/>
      <!-- tronc d'una peça: escorça grisa dalt, part pelada roja baix (vora ondulada) i arrels -->
      <path d="M66 167 Q70 150 72 128 L74 100 Q60 86 42 80 L46 73 Q64 80 76 92 Q84 76 106 70 L109 77 Q92 86 86 100 L88 128 Q90 150 96 167 Q81 171 66 167 Z" fill="#6f5b4d"/>
      <g stroke="#58483d" stroke-width="1.6" stroke-linecap="round"><path d="M77 104 V116 M82 108 V120 M79 96 V102"/></g>
      <path d="M67 167 Q70 150 71.6 131 Q75 126 79 130 Q83 125 88.4 129 Q90 150 95 167 Q81 171 67 167 Z" fill="#b5522f"/>
      <path d="M83 128 Q86 126 88.4 129 Q90 150 95 167 Q90 169 86 169 Q86 146 83 128 Z" fill="#8a381f"/>
      <path d="M82 100 L86 100 L88 128 Q86 126 83 128 Z" fill="#000" opacity="0.15"/>
      <ellipse cx="80" cy="64" rx="74" ry="44" fill="#2c5226"/>
      <ellipse cx="44" cy="74" rx="40" ry="28" fill="#2a4d24"/>
      <ellipse cx="116" cy="70" rx="40" ry="30" fill="#34602c"/>
      <ellipse cx="78" cy="42" rx="46" ry="28" fill="#3d6e33"/>
      <ellipse cx="62" cy="34" rx="26" ry="14" fill="#4f8541"/>
      <ellipse cx="108" cy="52" rx="20" ry="11" fill="#4f8541"/>
      <ellipse cx="30" cy="62" rx="14" ry="8" fill="#447a3a"/>
    </symbol>
    <!-- pi pinyoner: tronc una mica tort i copa plana en forma de para-sol -->
    <symbol id="pi" viewBox="0 0 40 70">
      <path d="M18 70 Q17 58 20 46 Q22 40 26 34 L28 35 Q24 42 22.5 48 Q21 58 22 70 Z" fill="#5a4030"/>
      <path d="M21 44 Q16 40 12 38 L13 36 Q18 39 22 42 Z" fill="#5a4030"/>
      <ellipse cx="22" cy="32" rx="18" ry="8" fill="#2f5a2b"/>
      <ellipse cx="11" cy="36" rx="8" ry="4.5" fill="#2f5a2b"/>
      <ellipse cx="19" cy="29" rx="11" ry="4.5" fill="#3b6b34"/>
    </symbol>
    <symbol id="casa" viewBox="0 0 70 56">
      <rect x="4" y="20" width="46" height="36" fill="#f6f1e7"/>
      <rect x="50" y="24" width="16" height="32" fill="#d9d1c2"/>
      <polygon points="0,22 27,6 54,22" fill="#c4613e"/>
      <polygon points="54,22 27,6 44,4 70,24" fill="#9e4a2e"/>
      <rect x="0" y="21" width="54" height="3" fill="#000" opacity="0.15"/>
      <rect x="12" y="30" width="9" height="10" fill="#51708f"/>
      <rect x="30" y="38" width="10" height="18" fill="#7a4f33"/>
    </symbol>
    <symbol id="mata" viewBox="0 0 60 30">
      <ellipse cx="30" cy="22" rx="30" ry="10" fill="#4d7d38"/>
      <ellipse cx="22" cy="17" rx="16" ry="9" fill="#5e9243"/>
      <ellipse cx="40" cy="18" rx="12" ry="7" fill="#679b4a"/>
    </symbol>
  </defs>

  <!-- cel i sol -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1330" cy="150" r="190" fill="url(#sol)"/>
  <circle cx="1330" cy="150" r="46" fill="#fffbe9"/>

  <!-- núvols amb la base ombrejada -->
  <g>
    <g fill="#dbe7f0"><ellipse cx="270" cy="162" rx="120" ry="24"/><ellipse cx="900" cy="112" rx="130" ry="20"/></g>
    <g fill="#fff">
      <ellipse cx="200" cy="146" rx="56" ry="26"/><ellipse cx="266" cy="126" rx="62" ry="38"/><ellipse cx="330" cy="146" rx="52" ry="24"/>
      <ellipse cx="850" cy="98" rx="60" ry="22"/><ellipse cx="920" cy="86" rx="58" ry="30"/><ellipse cx="985" cy="102" rx="44" ry="17"/>
    </g>
    <g fill="#fff" opacity="0.6"><ellipse cx="590" cy="220" rx="80" ry="10"/><ellipse cx="640" cy="212" rx="40" ry="10"/></g>
  </g>

  <!-- serres llunyanes (blavoses per la distància) -->
  <path d="M0 470 L140 372 L260 424 L420 300 L580 412 L760 330 L930 440 L1110 310 L1280 404 L1440 336 L1600 386 V620 H0 Z" fill="#a7c2cc"/>
  <g fill="#93b0bc">
    <polygon points="140,372 260,424 210,620 150,620"/><polygon points="420,300 580,412 520,620 430,620"/>
    <polygon points="760,330 930,440 860,620 770,620"/><polygon points="1110,310 1280,404 1220,620 1120,620"/>
    <polygon points="1440,336 1600,386 1600,620 1450,620"/>
  </g>
  <rect y="360" width="1600" height="260" fill="url(#boira)"/>

  <!-- Serra d'Espadà amb els penyals de rodeno -->
  <path d="M0 540 Q120 470 230 492 Q330 430 440 470 Q560 420 680 468 Q800 410 920 470 Q1040 430 1150 470 Q1280 410 1400 466 Q1510 440 1600 460 V700 H0 Z" fill="#6c9771"/>
  <g>
    <polygon points="290,660 326,470 360,436 398,462 426,660" fill="#c0603f"/>
    <polygon points="360,436 398,462 426,660 382,660 372,480" fill="#8e3b26"/>
    <polygon points="326,470 360,436 352,470 336,500" fill="#d9825f"/>

    <polygon points="784,660 818,462 858,420 894,450 920,660" fill="#c0603f"/>
    <polygon points="858,420 894,450 920,660 876,660 868,470" fill="#8e3b26"/>
    <polygon points="818,462 858,420 848,458 830,488" fill="#d9825f"/>

    <polygon points="1278,660 1306,470 1344,436 1374,462 1398,660" fill="#c0603f"/>
    <polygon points="1344,436 1374,462 1398,660 1358,660 1350,480" fill="#8e3b26"/>
    <polygon points="1306,470 1344,436 1336,468 1320,494" fill="#d9825f"/>

    <polygon points="544,660 568,500 596,480 618,500 632,660" fill="#b85a3b" opacity="0.9"/>
    <polygon points="596,480 618,500 632,660 606,660" fill="#8e3b26" opacity="0.9"/>
  </g>
  <!-- pinars de la serra -->
  <g>
    <use href="#pi" x="250" y="500" width="26" height="46"/><use href="#pi" x="276" y="510" width="22" height="40"/>
    <use href="#pi" x="440" y="486" width="24" height="42"/><use href="#pi" x="700" y="480" width="24" height="42"/>
    <use href="#pi" x="726" y="492" width="20" height="36"/><use href="#pi" x="960" y="478" width="24" height="42"/>
    <use href="#pi" x="1190" y="480" width="24" height="42"/><use href="#pi" x="1440" y="470" width="26" height="46"/>
    <use href="#pi" x="1466" y="482" width="22" height="38"/><use href="#pi" x="60" y="520" width="24" height="42"/>
  </g>

  <!-- turons verds de davant -->
  <path d="M0 600 Q200 520 420 580 Q600 530 760 572 Q920 520 1100 548 Q1300 510 1600 560 V760 H0 Z" fill="#528a45"/>

  <!-- el poble d'Eslida al vessant -->
