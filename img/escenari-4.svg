<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Avinguda València (Violència): avinguda urbana de nit, grafits, neó i un contenidor cremant -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f28"/>
      <stop offset="0.45" stop-color="#3a1f4a"/>
      <stop offset="0.75" stop-color="#8e3a3a"/>
      <stop offset="1" stop-color="#e0703f"/>
    </linearGradient>
    <radialGradient id="lluna">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="finA" width="46" height="56" patternUnits="userSpaceOnUse">
      <rect width="46" height="56" fill="#3a2f48"/>
      <rect x="10" y="12" width="24" height="30" fill="#ffd76a"/>
      <rect x="10" y="12" width="24" height="5" fill="#e0a84a"/>
      <rect x="8" y="42" width="28" height="4" fill="#2a2236"/>
    </pattern>
    <pattern id="finA2" width="92" height="112" patternUnits="userSpaceOnUse">
      <rect width="92" height="112" fill="#3a2f48"/>
      <rect x="10" y="12" width="24" height="30" fill="#ffd76a"/><rect x="56" y="12" width="24" height="30" fill="#221c2e"/>
      <rect x="10" y="68" width="24" height="30" fill="#24203a"/><rect x="56" y="68" width="24" height="30" fill="#7fb3ff" opacity="0.8"/>
      <rect x="8" y="42" width="28" height="4" fill="#2a2236"/><rect x="54" y="42" width="28" height="4" fill="#2a2236"/>
      <rect x="8" y="98" width="28" height="4" fill="#2a2236"/><rect x="54" y="98" width="28" height="4" fill="#2a2236"/>
    </pattern>
    <pattern id="finB" width="46" height="56" patternUnits="userSpaceOnUse">
      <rect width="46" height="56" fill="#2e293c"/>
      <rect x="10" y="12" width="24" height="30" fill="#1d1a27"/>
      <rect x="10" y="12" width="10" height="30" fill="#8fb4d9" opacity="0.25"/>
      <rect x="6" y="40" width="32" height="8" fill="#241f30"/>
    </pattern>
    <pattern id="persiana" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#6d6778"/>
      <rect y="7" width="10" height="3" fill="#57515f"/>
    </pattern>
    <radialGradient id="llum">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="con" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="foc">
      <stop offset="0" stop-color="#ffc35a" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#ff7a2a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302d36"/>
      <stop offset="1" stop-color="#1f1d24"/>
    </linearGradient>
    <linearGradient id="reflex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflexFoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.08"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.3"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.07"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.25"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#07040d" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="suau" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="fum" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <symbol id="fanal" viewBox="0 0 60 320">
      <rect x="27" y="20" width="6" height="300" fill="#15131b"/>
      <rect x="23" y="300" width="14" height="20" fill="#15131b"/>
      <path d="M30 22 Q30 8 50 8 L56 8" stroke="#15131b" stroke-width="5" fill="none"/>
      <rect x="42" y="4" width="18" height="9" rx="2" fill="#15131b"/>
      <rect x="44" y="12" width="14" height="4" fill="#fff4c4"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- estrelles -->
  <g fill="#fff">
    <circle cx="420" cy="60" r="1.6" opacity="0.8"/><circle cx="620" cy="140" r="1.2" opacity="0.6"/><circle cx="980" cy="50" r="1.8" opacity="0.9"/>
    <circle cx="1180" cy="120" r="1.2" opacity="0.6"/><circle cx="700" cy="40" r="1.2" opacity="0.7"/><circle cx="880" cy="190" r="1" opacity="0.5"/>
    <circle cx="1040" cy="170" r="1.4" opacity="0.6"/><circle cx="540" cy="220" r="1" opacity="0.5"/>
  </g>
  <circle cx="800" cy="120" r="110" fill="url(#lluna)"/>
  <circle cx="800" cy="120" r="34" fill="#f6e7d0"/>
  <circle cx="790" cy="112" r="7" fill="#e3d2b8"/><circle cx="812" cy="130" r="5" fill="#e3d2b8"/>

  <!-- blocs del fons -->
  <g fill="#2a1f3a">
    <rect x="480" y="300" width="120" height="440"/><rect x="700" y="360" width="80" height="380"/><rect x="820" y="280" width="110" height="460"/>
  </g>
  <g fill="#ffcf73" opacity="0.7"><rect x="500" y="330" width="10" height="12"/><rect x="560" y="390" width="10" height="12"/><rect x="840" y="320" width="10" height="12"/><rect x="890" y="410" width="10" height="12"/><rect x="720" y="400" width="10" height="12"/></g>

  <!-- blocs de pisos -->
  <rect x="0" y="140" width="300" height="620" fill="url(#finA2)"/>
  <rect x="300" y="260" width="230" height="500" fill="url(#finB)"/>
  <rect x="530" y="360" width="170" height="400" fill="url(#finA)"/>
  <rect x="900" y="330" width="190" height="430" fill="url(#finB)"/>
  <rect x="1090" y="220" width="250" height="540" fill="url(#finA2)"/>
  <rect x="1340" y="120" width="260" height="640" fill="url(#finB)"/>
  <!-- ombra de les cantonades -->
  <g fill="#000" opacity="0.25"><rect x="280" y="140" width="20" height="620"/><rect x="510" y="260" width="20" height="500"/><rect x="1320" y="220" width="20" height="540"/></g>
  <!-- cornises i terrats -->
  <g fill="#1a1524">
    <rect x="0" y="130" width="300" height="14"/><rect x="300" y="250" width="230" height="12"/><rect x="530" y="350" width="170" height="12"/>
    <rect x="900" y="320" width="190" height="12"/><rect x="1090" y="210" width="250" height="14"/><rect x="1340" y="110" width="260" height="14"/>
  </g>
  <g fill="#1a1524">
    <rect x="60" y="100" width="40" height="30"/><rect x="66" y="90" width="28" height="12"/>
    <rect x="1400" y="84" width="60" height="26"/><rect x="1200" y="190" width="30" height="20"/>
    <rect x="380" y="232" width="36" height="18"/>
  </g>
  <g stroke="#1a1524" stroke-width="3" fill="none">
    <path d="M200 130 V90 M184 100 H216 M188 110 H212"/><path d="M1520 110 V70 M1504 80 H1536 M1508 90 H1532"/><path d="M980 320 V286 M968 296 H992"/>
  </g>
  <!-- balcons amb roba i una parabòlica -->
  <g fill="#1d1827">
    <rect x="1100" y="302" width="60" height="6"/><rect x="1100" y="414" width="60" height="6"/><rect x="1192" y="302" width="60" height="6"/>
    <rect x="10" y="222" width="60" height="6"/><rect x="100" y="334" width="60" height="6"/>
  </g>
  <circle cx="1300" cy="270" r="12" fill="#bdb6c8"/><rect x="1298" y="270" width="4" height="16" fill="#8d869a"/>

  <!-- rètol de neó -->
  <g>
    <rect x="560" y="560" width="110" height="46" rx="8" fill="#1a1524" stroke="#ff4fa3" stroke-width="3"/>
    <text x="615" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#ff8ac6">BAR</text>
    <rect x="555" y="555" width="120" height="56" rx="10" fill="#ff4fa3" opacity="0.15"/>
  </g>

  <!-- baixos comercials amb persianes i grafits -->
  <rect x="0" y="640" width="700" height="100" fill="#4f4256"/>
  <rect x="900" y="640" width="700" height="100" fill="#453d52"/>
  <rect x="0" y="636" width="700" height="6" fill="#2a2236"/><rect x="900" y="636" width="700" height="6" fill="#2a2236"/>
  <rect x="40" y="652" width="220" height="88" fill="url(#persiana)"/>
  <rect x="330" y="652" width="220" height="88" fill="url(#persiana)"/>
  <rect x="1000" y="652" width="200" height="88" fill="url(#persiana)"/>
  <rect x="1260" y="652" width="200" height="88" fill="url(#persiana)"/>
  <text x="300" y="712" text-anchor="middle" transform="rotate(-4 300 700)" font-family="Impact, 'Arial Black', sans-serif" font-size="64" fill="#e3342f" stroke="#1a1a1a" stroke-width="3">VIOLÈNCIA</text>
  <text x="1250" y="705" text-anchor="middle" transform="rotate(3 1250 700)" font-family="Impact, 'Arial Black', sans-serif" font-size="40" fill="#39d0ff" stroke="#10222c" stroke-width="2" opacity="0.9">AV. VALÈNCIA</text>
  <path d="M1040 680 q20 -20 40 0 t40 0" stroke="#a3e635" stroke-width="6" fill="none" opacity="0.8"/>
  <rect x="740" y="560" width="120" height="180" fill="#231d2c"/>

  <!-- fanals amb el seu con de llum -->
  <polygon points="664,440 590,740 760,740" fill="url(#con)"/>
  <polygon points="1204,440 1130,740 1300,740" fill="url(#con)"/>
  <circle cx="664" cy="440" r="90" fill="url(#llum)"/>
  <circle cx="1204" cy="440" r="90" fill="url(#llum)"/>
  <use href="#fanal" x="620" y="430" width="60" height="320"/>
  <use href="#fanal" x="1160" y="430" width="60" height="320"/>
  <!-- semàfor en roig -->
  <rect x="1497" y="560" width="8" height="190" fill="#15131b"/>
  <rect x="1482" y="500" width="38" height="92" rx="6" fill="#15131b"/>
  <circle cx="1501" cy="518" r="34" fill="#ff3b30" opacity="0.22"/>
  <circle cx="1501" cy="518" r="11" fill="#ff3b30"/>
  <circle cx="1501" cy="546" r="11" fill="#4a3a1a"/>
  <circle cx="1501" cy="574" r="11" fill="#1a3a22"/>

  <!-- contenidor cremant -->
  <circle cx="820" cy="680" r="190" fill="url(#foc)"/>
  <g fill="#2b2530" opacity="0.75" filter="url(#fum)">
    <ellipse cx="826" cy="600" rx="40" ry="26"/><ellipse cx="850" cy="540" rx="58" ry="34"/><ellipse cx="892" cy="470" rx="76" ry="40"/><ellipse cx="950" cy="400" rx="90" ry="42"/>
  </g>
  <g fill="#4a3f4d" opacity="0.5" filter="url(#fum)"><ellipse cx="836" cy="530" rx="30" ry="18"/><ellipse cx="880" cy="460" rx="40" ry="20"/></g>
  <rect x="768" y="688" width="104" height="58" rx="6" fill="#2e6b3a"/>
  <rect x="768" y="688" width="104" height="10" rx="4" fill="#225230"/>
  <rect x="780" y="704" width="80" height="4" fill="#224f2c"/>
  <g fill="#1a1a1a"><circle cx="784" cy="748" r="6"/><circle cx="856" cy="748" r="6"/></g>
  <path d="M776 692 Q784 630 802 664 Q810 598 830 654 Q844 618 852 664 Q866 640 866 692 Z" fill="#ff7a14"/>
  <path d="M792 692 Q802 654 814 674 Q822 640 836 678 Q846 664 850 692 Z" fill="#ffc83f"/>
  <path d="M808 692 Q814 676 822 684 Q828 670 836 692 Z" fill="#fff2a8"/>
  <g fill="#ffb347"><circle cx="846" cy="620" r="2.5"/><circle cx="812" cy="600" r="2"/><circle cx="860" cy="580" r="2"/></g>
  <!-- bosses de fem -->
  <g><ellipse cx="900" cy="734" rx="26" ry="16" fill="#15131b"/><ellipse cx="930" cy="738" rx="20" ry="12" fill="#221f28"/><ellipse cx="896" cy="726" rx="8" ry="4" fill="#3b3743"/></g>

  <!-- vorera -->
  <rect y="740" width="1600" height="8" fill="#6f687a"/>
  <!-- avinguda mullada, amb els reflexos de les llums -->
  <rect y="748" width="1600" height="152" fill="url(#asfalt)"/>
  <rect y="748" width="1600" height="152" fill="url(#gra)"/>
  <rect y="748" width="1600" height="6" fill="#000" opacity="0.35"/>
  <g filter="url(#suau)">
    <rect x="648" y="756" width="32" height="130" fill="url(#reflex)"/>
    <rect x="1188" y="756" width="32" height="130" fill="url(#reflex)"/>
    <rect x="770" y="756" width="100" height="140" fill="url(#reflexFoc)"/>
    <rect x="1492" y="756" width="18" height="90" fill="#ff3b30" opacity="0.2"/>
  </g>
  <g fill="#e9e9e9" opacity="0.85">
    <rect x="1040" y="758" width="22" height="134"/><rect x="1080" y="758" width="22" height="134"/>
    <rect x="1120" y="758" width="22" height="134"/><rect x="1160" y="758" width="22" height="134"/>
    <rect x="1200" y="758" width="22" height="134"/>
  </g>
  <line x1="0" y1="826" x2="1000" y2="826" stroke="#e6e3ea" stroke-width="6" stroke-dasharray="60 60" opacity="0.85"/>
  <line x1="1250" y1="826" x2="1600" y2="826" stroke="#e6e3ea" stroke-width="6" stroke-dasharray="60 60" opacity="0.85"/>
  <!-- con caigut i llanda -->
  <g transform="rotate(-70 170 846)">
    <polygon points="146,870 194,870 170,806" fill="#ff7a1a"/>
    <rect x="156" y="832" width="28" height="8" fill="#fff"/>
    <rect x="140" y="868" width="60" height="8" fill="#e0640f"/>
  </g>
  <ellipse cx="460" cy="872" rx="10" ry="5" fill="#b8b3be"/>

  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
