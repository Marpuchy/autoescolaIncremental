<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- València Centre: les Torres de Serrans, el Micalet, façanes amb balcons, palmeres i el carril bici -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa7e0"/>
      <stop offset="1" stop-color="#cfe9f8"/>
    </linearGradient>
    <symbol id="palmera" viewBox="0 0 120 300">
      <path d="M58 300 Q54 180 62 60" stroke="#8a6a44" stroke-width="12" fill="none"/>
      <g fill="#3f8a3a">
        <path d="M62 60 Q20 40 0 70 Q30 52 62 64Z"/><path d="M62 60 Q100 36 120 66 Q92 50 62 64Z"/>
        <path d="M62 58 Q40 10 12 20 Q44 24 60 62Z"/><path d="M62 58 Q86 8 112 22 Q80 26 64 62Z"/>
        <path d="M62 56 Q62 20 64 0 Q70 30 64 60Z"/>
      </g>
    </symbol>
    <pattern id="balcons" width="70" height="90" patternUnits="userSpaceOnUse">
      <rect width="70" height="90" fill="#e9d4b0"/>
      <rect x="18" y="14" width="34" height="54" fill="#5a6e7e"/>
      <rect x="12" y="62" width="46" height="5" fill="#2e2e2e"/>
      <g stroke="#2e2e2e" stroke-width="2"><line x1="16" y1="67" x2="16" y2="78"/><line x1="35" y1="67" x2="35" y2="78"/><line x1="54" y1="67" x2="54" y2="78"/></g>
      <rect x="12" y="76" width="46" height="3" fill="#2e2e2e"/>
    </pattern>
    <pattern id="balconsB" width="70" height="90" patternUnits="userSpaceOnUse">
      <rect width="70" height="90" fill="#f1e4cb"/>
      <rect x="18" y="14" width="34" height="54" fill="#4d6a5c"/>
      <rect x="12" y="62" width="46" height="5" fill="#2e2e2e"/>
      <g stroke="#2e2e2e" stroke-width="2"><line x1="16" y1="67" x2="16" y2="78"/><line x1="35" y1="67" x2="35" y2="78"/><line x1="54" y1="67" x2="54" y2="78"/></g>
      <rect x="12" y="76" width="46" height="3" fill="#2e2e2e"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.85"><ellipse cx="1200" cy="110" rx="110" ry="26"/><ellipse cx="1270" cy="94" rx="60" ry="24"/></g>

  <!-- el Micalet i la cúpula de la catedral -->
  <rect x="930" y="150" width="84" height="420" fill="#d8bf93"/>
  <rect x="924" y="150" width="96" height="14" fill="#c4a878"/>
  <rect x="945" y="175" width="18" height="46" fill="#6b5640"/><rect x="981" y="175" width="18" height="46" fill="#6b5640"/>
  <rect x="940" y="260" width="64" height="6" fill="#c4a878"/><rect x="940" y="360" width="64" height="6" fill="#c4a878"/>
  <rect x="948" y="120" width="48" height="32" fill="#d8bf93"/>
  <path d="M948 120 Q972 86 996 120 Z" fill="#c4a878"/>
  <rect x="968" y="70" width="8" height="30" fill="#6b5640"/>
  <path d="M1040 470 Q1110 370 1180 470 Z" fill="#3f7fb3"/>
  <rect x="1040" y="468" width="140" height="102" fill="#d4ba8c"/>

  <!-- Torres de Serrans -->
  <g>
    <rect x="160" y="300" width="160" height="400" fill="#cbb08a"/>
    <rect x="420" y="300" width="160" height="400" fill="#cbb08a"/>
    <rect x="300" y="360" width="140" height="340" fill="#c1a57e"/>
    <path d="M320 700 V520 Q370 450 420 520 V700 Z" fill="#3d3128"/>
    <g fill="#cbb08a">
      <rect x="160" y="276" width="24" height="28"/><rect x="200" y="276" width="24" height="28"/><rect x="240" y="276" width="24" height="28"/><rect x="280" y="276" width="24" height="28"/>
      <rect x="420" y="276" width="24" height="28"/><rect x="460" y="276" width="24" height="28"/><rect x="500" y="276" width="24" height="28"/><rect x="540" y="276" width="24" height="28"/>
      <rect x="300" y="340" width="20" height="24"/><rect x="340" y="340" width="20" height="24"/><rect x="380" y="340" width="20" height="24"/><rect x="420" y="340" width="20" height="24"/>
    </g>
    <g fill="#8f765a"><rect x="230" y="380" width="14" height="40"/><rect x="490" y="380" width="14" height="40"/><rect x="230" y="500" width="14" height="40"/><rect x="490" y="500" width="14" height="40"/></g>
  </g>

  <!-- edificis amb balcons -->
  <rect x="0" y="360" width="160" height="340" fill="url(#balcons)"/>
  <rect x="600" y="400" width="300" height="300" fill="url(#balconsB)"/>
  <rect x="1200" y="330" width="220" height="370" fill="url(#balcons)"/>
  <rect x="1420" y="380" width="180" height="320" fill="url(#balconsB)"/>
  <g fill="#b98e5f"><rect x="0" y="350" width="160" height="12"/><rect x="600" y="390" width="300" height="12"/><rect x="1200" y="320" width="220" height="12"/><rect x="1420" y="370" width="180" height="12"/></g>

  <!-- palmeres -->
  <use href="#palmera" x="560" y="420" width="100" height="280"/>
  <use href="#palmera" x="1100" y="420" width="100" height="280"/>

  <!-- vorera i carril bici -->
  <rect y="700" width="1600" height="30" fill="#c9c2b6"/>
  <rect y="730" width="1600" height="30" fill="#b5423b"/>
  <g fill="#fff" opacity="0.9"><rect x="200" y="742" width="40" height="6"/><rect x="700" y="742" width="40" height="6"/><rect x="1200" y="742" width="40" height="6"/></g>
  <!-- avinguda -->
  <rect y="760" width="1600" height="140" fill="#46494e"/>
  <line x1="0" y1="832" x2="1600" y2="832" stroke="#f3f3f3" stroke-width="6" stroke-dasharray="60 60"/>
  <g fill="#e9e9e9" opacity="0.9">
    <rect x="1300" y="770" width="20" height="120"/><rect x="1336" y="770" width="20" height="120"/>
    <rect x="1372" y="770" width="20" height="120"/><rect x="1408" y="770" width="20" height="120"/>
  </g>
</svg>
