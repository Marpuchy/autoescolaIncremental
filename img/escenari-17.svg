<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Morella i els Ports: el poble emmurallat al turó amb el castell dalt de la roca, l'aqüeducte, boira, neu als cims i murs de pedra en sec -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9ab8"/><stop offset="0.6" stop-color="#c3d2e0"/><stop offset="0.85" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="boira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6" stop-opacity="0"/><stop offset="0.5" stop-color="#eef2f6" stop-opacity="0.75"/><stop offset="1" stop-color="#eef2f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55595e"/><stop offset="1" stop-color="#3c3f44"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.1"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.08"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
    </pattern>
    <pattern id="pedra" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#b9a688"/><path d="M0 10 H40 M20 0 V10 M10 10 V20 M30 10 V20" stroke="#97856a" stroke-width="2"/>
    </pattern>
    <pattern id="sec" width="34" height="16" patternUnits="userSpaceOnUse">
      <rect width="34" height="16" fill="#a39684"/><ellipse cx="9" cy="5" rx="8" ry="4" fill="#bcae9a"/><ellipse cx="26" cy="11" rx="8" ry="4" fill="#b3a592"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a1e24" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- cims nevats -->
  <!-- les serralades baixen fins darrere del turó (abans quedava una falca de cel entre muntanyes i vall) -->
  <path d="M0 420 L180 280 L320 380 L480 260 L640 410 L760 470 H0 Z" fill="#8a96a6"/>
  <path d="M840 470 L980 390 L1140 250 L1280 360 L1420 270 L1600 380 V470 Z" fill="#8a96a6"/>
  <!-- cara a l'ombra de cada cim -->
  <path d="M180 280 L320 380 L250 400 Z M480 260 L640 410 L560 420 Z M1140 250 L1280 360 L1210 380 Z M1420 270 L1600 380 L1520 400 Z" fill="#7a8696"/>
  <!-- neu: comença just al cim i seguix els dos vessants -->
  <path d="M180 280 L222 310 L204 304 L190 314 L172 302 L140 311 Z M480 260 L512 290 L496 286 L482 296 L466 285 L440 290 Z M1140 250 L1179 281 L1162 276 L1148 288 L1130 277 L1105 281 Z M1420 270 L1460 294 L1442 291 L1428 302 L1410 292 L1378 297 Z" fill="#fff"/>
  <!-- vall entre les muntanyes (perquè no es veja el cel per baix) -->
  <path d="M0 450 Q400 420 800 440 Q1200 420 1600 450 V640 H0 Z" fill="#8f9a86"/>
  <!-- el turó de Morella amb muralla i castell -->
  <path d="M440 620 Q520 420 640 380 Q760 300 880 380 Q1000 440 1100 620 Z" fill="#9a8a70"/>
  <path d="M520 560 Q600 470 700 450 H900 Q980 480 1040 560 Z" fill="url(#pedra)"/>
  <g fill="#b9a688">
    <rect x="520" y="548" width="540" height="20"/>
    <rect x="530" y="534" width="14" height="14"/><rect x="560" y="534" width="14" height="14"/><rect x="590" y="534" width="14" height="14"/>
    <rect x="980" y="534" width="14" height="14"/><rect x="1010" y="534" width="14" height="14"/><rect x="1040" y="534" width="14" height="14"/>
  </g>
  <!-- cases del poble -->
  <g fill="#e6dccb"><rect x="600" y="470" width="70" height="80"/><rect x="690" y="450" width="80" height="100"/><rect x="800" y="460" width="70" height="90"/><rect x="890" y="480" width="70" height="70"/></g>
  <g fill="#9a5a3a"><path d="M594 472 L612 456 H658 L676 472 Z"/><path d="M684 452 L704 434 H756 L776 452 Z"/><path d="M794 462 L812 446 H858 L876 462 Z"/><path d="M884 482 L902 466 H948 L966 482 Z"/></g>
  <!-- finestres amb porticons, balcons i portes de les cases -->
  <g fill="#5a4a3e"><rect x="614" y="486" width="12" height="16"/><rect x="644" y="486" width="12" height="16"/><rect x="626" y="520" width="16" height="30"/>
    <rect x="704" y="466" width="12" height="16"/><rect x="744" y="466" width="12" height="16"/><rect x="704" y="500" width="12" height="16"/><rect x="744" y="500" width="12" height="16"/>
    <rect x="814" y="476" width="12" height="16"/><rect x="844" y="476" width="12" height="16"/><rect x="826" y="516" width="18" height="34" rx="8"/>
    <rect x="904" y="494" width="12" height="16"/><rect x="934" y="494" width="12" height="16"/></g>
  <g fill="#6b8a4a"><rect x="610" y="486" width="4" height="16"/><rect x="626" y="486" width="4" height="16"/><rect x="740" y="466" width="4" height="16"/><rect x="756" y="466" width="4" height="16"/><rect x="810" y="476" width="4" height="16"/><rect x="826" y="476" width="4" height="16"/></g>
  <path d="M700 518 H762" stroke="#3a3a3a" stroke-width="3"/><path d="M702 518 V526 M716 518 V526 M730 518 V526 M744 518 V526 M760 518 V526" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- castell dalt de la roca -->
  <path d="M700 380 L740 300 H860 L890 380 Z" fill="#8a7a62"/>
  <rect x="740" y="250" width="120" height="60" fill="url(#pedra)"/>
  <g fill="#b9a688"><rect x="740" y="238" width="14" height="14"/><rect x="770" y="238" width="14" height="14"/><rect x="800" y="238" width="14" height="14"/><rect x="830" y="238" width="14" height="14"/></g>
  <rect x="790" y="200" width="30" height="50" fill="url(#pedra)"/>
  <path d="M786 202 L805 180 L824 202 Z" fill="#97856a"/>
  <!-- campanar de Santa Maria -->
  <rect x="900" y="400" width="30" height="80" fill="#cfc0a2"/><path d="M896 402 L915 372 L934 402 Z" fill="#9a5a3a"/>
  <!-- aqüeducte de Santa Llúcia -->
  <g>
    <rect x="80" y="520" width="380" height="24" fill="url(#pedra)"/>
    <g fill="url(#pedra)"><rect x="90" y="544" width="24" height="120"/><rect x="190" y="544" width="24" height="120"/><rect x="290" y="544" width="24" height="120"/><rect x="390" y="544" width="24" height="120"/></g>
    <g fill="#c3d2e0"><path d="M114 664 V570 Q152 540 190 570 V664 Z"/><path d="M214 664 V570 Q252 540 290 570 V664 Z"/><path d="M314 664 V570 Q352 540 390 570 V664 Z"/></g>
  </g>
  <!-- boira entre muntanyes -->
  <rect y="380" width="1600" height="200" fill="url(#boira)"/>
  <!-- prats amb murs de pedra en sec -->
  <path d="M0 620 Q400 590 800 610 Q1200 590 1600 620 V700 H0 Z" fill="#8aa06e"/>
  <rect y="650" width="1600" height="22" fill="url(#sec)"/>
  <g fill="#f2f0ea"><ellipse cx="1180" cy="640" rx="16" ry="10"/><ellipse cx="1220" cy="636" rx="14" ry="9"/><ellipse cx="1300" cy="642" rx="16" ry="10"/></g>
  <g fill="#3a3a3a"><circle cx="1192" cy="636" r="4"/><circle cx="1231" cy="632" r="4"/><circle cx="1312" cy="638" r="4"/></g>
  <path d="M1172 646 V654 M1186 646 V654 M1214 641 V649 M1226 641 V649 M1292 648 V656 M1306 648 V656" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
  <!-- carretera de muntanya -->
  <rect y="690" width="1600" height="12" fill="#9a8f7e"/>
  <rect y="700" width="1600" height="200" fill="url(#asfalt)"/><rect y="700" width="1600" height="200" fill="url(#gra)"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#f3f1e6" stroke-width="5" stroke-dasharray="60 60" opacity="0.9"/>
  <!-- restes de neu a la cuneta (muntets sobre la vora, no damunt de l'asfalt) -->
  <g fill="#f4f6f8"><path d="M50 692 Q90 674 130 680 Q170 676 196 692 Z"/><path d="M712 692 Q744 680 776 683 Q800 682 812 692 Z"/><path d="M1380 692 Q1420 672 1470 678 Q1520 674 1544 692 Z"/></g>
  <g fill="#c9d6e6"><path d="M60 692 Q120 686 196 692 Z"/><path d="M720 692 Q770 688 812 692 Z"/><path d="M1390 692 Q1460 685 1544 692 Z"/></g>
  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
