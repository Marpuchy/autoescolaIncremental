<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Desert de les Palmes: muntanyes de pedra, pins, el monestir dels Carmelites, la creu al cim, la mar al fons i una carretera de revolts -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa2d8"/><stop offset="0.6" stop-color="#a6d4ee"/><stop offset="0.85" stop-color="#eaf6fb"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9ac8"/><stop offset="1" stop-color="#2f6f9a"/></linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55595e"/><stop offset="1" stop-color="#3c3f44"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.1"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.08"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
    </pattern>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#101a14" stop-opacity="0.35"/>
    </radialGradient>
    <symbol id="pi" viewBox="0 0 80 120">
      <path d="M38 120 Q36 80 42 50 L46 50 Q42 80 44 120 Z" fill="#6b4a2f"/>
      <ellipse cx="40" cy="40" rx="38" ry="18" fill="#2f5e2a"/><ellipse cx="34" cy="30" rx="26" ry="12" fill="#3a7234"/><ellipse cx="50" cy="26" rx="18" ry="9" fill="#467f3d"/>
    </symbol>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="360" cy="100" rx="90" ry="16"/><ellipse cx="1240" cy="130" rx="100" ry="16"/></g>
  <!-- la mar llunyana -->
  <rect x="0" y="420" width="1600" height="60" fill="url(#mar)"/>
  <!-- muntanyes de pedra rogenca -->
  <path d="M0 470 L120 330 L240 400 L380 230 L520 380 L640 300 L760 420 V520 H0 Z" fill="#a8806a"/>
  <path d="M700 470 L860 260 L960 340 L1080 200 L1220 360 L1340 280 L1480 380 L1600 330 V520 H700 Z" fill="#9a7460"/>
  <path d="M380 230 L420 300 L400 380 L340 300 Z M1080 200 L1120 280 L1100 360 L1040 280 Z" fill="#c09a82" opacity="0.6"/>
  <!-- la creu al cim -->
  <rect x="1077" y="160" width="6" height="42" fill="#f2f0ea"/><rect x="1066" y="172" width="28" height="6" fill="#f2f0ea"/>
  <!-- pinars -->
  <path d="M0 520 Q300 470 600 500 Q900 460 1200 500 Q1420 470 1600 500 V700 H0 Z" fill="#5e7a48"/>
  <use href="#pi" x="60" y="430" width="100" height="150"/><use href="#pi" x="200" y="460" width="80" height="120"/>
  <use href="#pi" x="1320" y="440" width="100" height="150"/><use href="#pi" x="1460" y="470" width="80" height="120"/>
  <!-- el monestir del Desert -->
  <g>
    <rect x="620" y="440" width="300" height="140" fill="#eadfc8"/><rect x="620" y="430" width="300" height="14" fill="#b9603f"/>
    <rect x="860" y="360" width="60" height="220" fill="#e2d4b8"/><path d="M856 362 L890 320 L924 362 Z" fill="#b9603f"/>
    <path d="M880 400 V380 Q890 368 900 380 V400 Z" fill="#4a3a2a"/>
    <g fill="#5f6f7a"><rect x="650" y="470" width="20" height="30"/><rect x="700" y="470" width="20" height="30"/><rect x="750" y="470" width="20" height="30"/><rect x="800" y="470" width="20" height="30"/></g>
    <path d="M730 580 V530 Q750 510 770 530 V580 Z" fill="#6b4426"/>
    <g fill="#2f5e2a"><path d="M600 580 L610 480 L620 580 Z"/><path d="M932 580 L942 470 L952 580 Z"/></g>
  </g>
  <use href="#pi" x="420" y="520" width="110" height="170"/><use href="#pi" x="1060" y="530" width="110" height="170"/>
  <!-- marge de pedra i carretera de revolts -->
  <path d="M0 690 Q400 676 800 690 Q1200 704 1600 688 V720 H0 Z" fill="#b39a7a"/>
  <rect y="706" width="1600" height="194" fill="url(#asfalt)"/><rect y="706" width="1600" height="194" fill="url(#gra)"/>
  <path d="M0 800 Q400 770 800 800 T1600 800" stroke="#f2c200" stroke-width="5" fill="none"/>
  <path d="M0 808 Q400 778 800 808 T1600 808" stroke="#f2c200" stroke-width="5" fill="none"/>
  <!-- senyal de revolts perillosos -->
  <g><rect x="1440" y="600" width="7" height="110" fill="#6b7480"/><polygon points="1443,540 1490,612 1396,612" fill="#fff" stroke="#d1261f" stroke-width="8" stroke-linejoin="round"/>
    <path d="M1430 600 Q1450 590 1440 578 Q1432 568 1452 560" stroke="#1d1d1d" stroke-width="5" fill="none"/></g>
  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
