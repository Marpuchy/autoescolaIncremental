<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Falles de València: un monument faller enorme i colorit, arcs de llums de colors, fum de mascletà i finques amb balcons -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f6a"/><stop offset="0.55" stop-color="#7a4f9a"/><stop offset="0.85" stop-color="#f0a070"/>
    </linearGradient>
    <linearGradient id="asfalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4a52"/><stop offset="1" stop-color="#36343a"/>
    </linearGradient>
    <pattern id="gra" width="48" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.6" fill="#fff" opacity="0.1"/><circle cx="30" cy="4" r="1.2" fill="#000" opacity="0.2"/>
      <circle cx="20" cy="22" r="1.4" fill="#fff" opacity="0.08"/><circle cx="42" cy="28" r="1.8" fill="#000" opacity="0.15"/>
    </pattern>
    <pattern id="balcons" width="70" height="90" patternUnits="userSpaceOnUse">
      <rect width="70" height="90" fill="#d9b88f"/><rect x="18" y="14" width="34" height="54" fill="#4a3f5a"/>
      <rect x="18" y="14" width="16" height="54" fill="#6a5f7a"/><rect x="12" y="62" width="46" height="5" fill="#2e2e2e"/>
      <g stroke="#2e2e2e" stroke-width="2"><line x1="16" y1="67" x2="16" y2="78"/><line x1="35" y1="67" x2="35" y2="78"/><line x1="54" y1="67" x2="54" y2="78"/></g>
      <rect x="12" y="76" width="46" height="3" fill="#2e2e2e"/>
    </pattern>
    <radialGradient id="fum"><stop offset="0" stop-color="#d8d0dc" stop-opacity="0.8"/><stop offset="1" stop-color="#d8d0dc" stop-opacity="0"/></radialGradient>
    <radialGradient id="vinyeta" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#140a20" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="160" cy="70" r="2"/><circle cx="520" cy="40" r="1.5"/><circle cx="1100" cy="60" r="2"/><circle cx="1450" cy="40" r="1.5"/></g>
  <!-- focs artificials -->
  <g stroke="#ffd23f" stroke-width="3" opacity="0.8"><path d="M300 150 L300 110 M300 150 L330 125 M300 150 L270 125 M300 150 L335 155 M300 150 L265 155 M300 150 L320 180 M300 150 L280 180"/></g>
  <g stroke="#ff5ab0" stroke-width="3" opacity="0.8"><path d="M1300 130 L1300 90 M1300 130 L1330 105 M1300 130 L1270 105 M1300 130 L1335 135 M1300 130 L1265 135 M1300 130 L1320 160 M1300 130 L1280 160"/></g>
  <!-- finques -->
  <rect x="0" y="240" width="380" height="460" fill="url(#balcons)"/><rect x="1220" y="220" width="380" height="480" fill="url(#balcons)"/>
  <rect x="0" y="230" width="380" height="12" fill="#b8936a"/><rect x="1220" y="210" width="380" height="12" fill="#b8936a"/>
  <!-- fum de la mascletà -->
  <ellipse cx="500" cy="380" rx="160" ry="80" fill="url(#fum)"/><ellipse cx="1120" cy="360" rx="180" ry="90" fill="url(#fum)"/>
  <!-- el monument faller: base, ninots i figura central gegant -->
  <path d="M560 700 L600 560 H1000 L1040 700 Z" fill="#e2c07a"/>
  <path d="M600 560 H1000 L990 600 H610 Z" fill="#c9a050"/>
  <g>
    <!-- figura central: una senyora gegant amb ventall -->
    <path d="M700 560 Q680 380 760 300 H840 Q920 380 900 560 Z" fill="#e2483a"/>
    <path d="M720 560 Q720 440 800 400 Q880 440 880 560 Z" fill="#f2c200"/>
    <circle cx="800" cy="250" r="72" fill="#ffd9b8"/>
    <circle cx="772" cy="240" r="13" fill="#fff"/><circle cx="828" cy="240" r="13" fill="#fff"/>
    <circle cx="775" cy="242" r="6" fill="#1d1d1d"/><circle cx="825" cy="242" r="6" fill="#1d1d1d"/>
    <path d="M770 286 Q800 306 830 286" stroke="#a03030" stroke-width="6" fill="none"/>
    <ellipse cx="760" cy="270" rx="12" ry="8" fill="#ff7a8a" opacity="0.6"/><ellipse cx="840" cy="270" rx="12" ry="8" fill="#ff7a8a" opacity="0.6"/>
    <path d="M722 210 Q730 150 800 150 Q870 150 878 210 Q860 180 800 180 Q740 180 722 210 Z" fill="#6a3a1a"/>
    <circle cx="800" cy="146" r="22" fill="#6a3a1a"/>
    <path d="M900 420 L980 340 L1000 380 Z" fill="#3a7bd5"/><path d="M900 420 L980 340 L960 330 Z" fill="#ff5ab0"/>
    <!-- ninots petits -->
    <g><circle cx="650" cy="520" r="22" fill="#ffd9b8"/><rect x="630" y="540" width="40" height="30" fill="#3a7bd5"/><circle cx="643" cy="516" r="4" fill="#1d1d1d"/><circle cx="657" cy="516" r="4" fill="#1d1d1d"/></g>
    <g><circle cx="950" cy="520" r="22" fill="#ffd9b8"/><rect x="930" y="540" width="40" height="30" fill="#3aa86a"/><circle cx="943" cy="516" r="4" fill="#1d1d1d"/><circle cx="957" cy="516" r="4" fill="#1d1d1d"/><rect x="930" y="490" width="40" height="10" fill="#1d1d1d"/></g>
  </g>
  <!-- arcs de llums de colors -->
  <g fill="none" stroke="#3a3040" stroke-width="3"><path d="M380 200 Q800 120 1220 200"/><path d="M380 250 Q800 170 1220 250"/></g>
  <g>
    <g fill="#ffd23f"><circle cx="440" cy="190" r="6"/><circle cx="600" cy="162" r="6"/><circle cx="800" cy="150" r="6"/><circle cx="1000" cy="162" r="6"/><circle cx="1160" cy="190" r="6"/></g>
    <g fill="#ff5ab0"><circle cx="520" cy="174" r="6"/><circle cx="700" cy="154" r="6"/><circle cx="900" cy="154" r="6"/><circle cx="1080" cy="174" r="6"/></g>
    <g fill="#4ae0ff"><circle cx="440" cy="240" r="6"/><circle cx="620" cy="210" r="6"/><circle cx="800" cy="200" r="6"/><circle cx="980" cy="210" r="6"/><circle cx="1160" cy="240" r="6"/></g>
  </g>
  <!-- tanques de seguretat -->
  <g fill="#c9ced3"><rect x="520" y="660" width="560" height="6"/><rect x="520" y="690" width="560" height="6"/></g>
  <g fill="#9aa0a6"><rect x="530" y="650" width="6" height="50"/><rect x="700" y="650" width="6" height="50"/><rect x="900" y="650" width="6" height="50"/><rect x="1070" y="650" width="6" height="50"/></g>
  <!-- carrer tallat -->
  <rect y="700" width="1600" height="200" fill="url(#asfalt)"/><rect y="700" width="1600" height="200" fill="url(#gra)"/>
  <rect y="700" width="1600" height="6" fill="#8a8590"/>
  <!-- confeti i restes de petards per terra -->
  <g><rect x="200" y="760" width="8" height="4" fill="#ff5ab0"/><rect x="420" y="820" width="8" height="4" fill="#ffd23f" transform="rotate(30 424 822)"/><rect x="980" y="780" width="8" height="4" fill="#4ae0ff"/><rect x="1300" y="840" width="8" height="4" fill="#ff5ab0" transform="rotate(-20 1304 842)"/>
    <path d="M640 860 l10 -4 l2 6 Z M1120 760 l10 -4 l2 6 Z" fill="#c4161c"/></g>
  <rect width="1600" height="900" fill="url(#vinyeta)"/>
</svg>
